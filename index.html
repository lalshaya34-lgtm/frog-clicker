<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#55b84a">
<title>Frog Clicker: Pondbound</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --green:#39a852;
  --dark:#123c29;
  --lime:#9cff62;
  --water:#6bd5ed;
  --panel:#f5fff1;
  --gold:#ffd84d;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:#173b29;
  background:
    radial-gradient(circle at 20% 10%,#d9ffd0,transparent 30%),
    linear-gradient(#8bdcf0,#dff8d4 55%,#b8e987);
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  max-width:1500px;
  margin:auto;
  padding:14px;
}

/* =========================
   TOP
========================= */

.top{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
  border-radius:20px;
  background:#ffffffdd;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 30px #17462c20;
  position:sticky;
  top:8px;
  z-index:100;
}

.logo{
  font-size:23px;
  font-weight:1000;
}

.stats{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.stat{
  padding:8px 11px;
  border-radius:12px;
  background:#e9f8e5;
  font-size:12px;
  font-weight:900;
}

.stat b{
  color:#16853a;
}

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 390px;
  gap:14px;
  margin-top:14px;
}

@media(max-width:950px){
  .main{
    grid-template-columns:1fr;
  }
}

/* =========================
   PANELS
========================= */

.panel{
  background:#ffffffde;
  backdrop-filter:blur(12px);
  border:1px solid #ffffff;
  border-radius:22px;
  padding:15px;
  box-shadow:0 12px 40px #17462c20;
  margin-bottom:14px;
}

.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}

.panel-title h2{
  margin:0;
  font-size:18px;
}

.small{
  font-size:10px;
  color:#708373;
}

/* =========================
   POND
========================= */

.pond{
  min-height:610px;
  position:relative;
  overflow:hidden;
  border-radius:28px;
  background:
    radial-gradient(circle at 30% 30%,#ffffff55 0 3px,transparent 4px),
    radial-gradient(circle at 70% 65%,#ffffff44 0 2px,transparent 3px),
    linear-gradient(#65cfe9,#48b9d9 45%,#2c9b8d);
  border:6px solid #237d62;
  box-shadow:
    inset 0 0 80px #155b4730,
    0 20px 40px #194b3825;
}

.pond:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.3;
  background:
    repeating-radial-gradient(
      ellipse at 20% 80%,
      transparent 0 35px,
      #b7f5ff 36px 38px,
      transparent 39px 80px
    );
}

.lilypad{
  position:absolute;
  width:100px;
  height:58px;
  border-radius:70% 30% 70% 30%;
  background:linear-gradient(135deg,#75d44d,#2e8d43);
  box-shadow:inset -8px -8px 10px #145d3928;
}

.lilypad:after{
  content:"";
  position:absolute;
  left:48%;
  top:0;
  height:100%;
  width:3px;
  background:#1e703d88;
  transform:rotate(25deg);
}

.lp1{
  left:7%;
  bottom:13%;
  transform:rotate(-10deg);
}

.lp2{
  right:8%;
  top:14%;
  transform:rotate(18deg);
}

.lp3{
  right:20%;
  bottom:9%;
  transform:scale(.7) rotate(-12deg);
}

.pond-text{
  position:absolute;
  left:20px;
  top:18px;
  z-index:2;
  color:white;
  text-shadow:0 2px 5px #154d55;
}

.pond-text h1{
  margin:0;
  font-size:28px;
}

.pond-text span{
  font-size:11px;
}

/* =========================
   FROG
========================= */

.frog-stage{
  position:absolute;
  left:50%;
  top:52%;
  width:300px;
  height:300px;
  transform:translate(-50%,-50%);
  z-index:10;
}

.frog-shadow{
  position:absolute;
  width:225px;
  height:45px;
  left:38px;
  bottom:18px;
  border-radius:50%;
  background:#063c3744;
  filter:blur(7px);
}

.frog{
  position:absolute;
  left:10px;
  top:20px;
  width:280px;
  height:245px;
  cursor:pointer;
  user-select:none;
  transform-origin:center bottom;
  filter:drop-shadow(0 22px 12px #003f3044);
  animation:breathe 2.8s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{
    transform:translateY(0) scaleY(1);
  }

  50%{
    transform:translateY(-5px) scaleY(1.025);
  }
}

.frog.jump{
  animation:jump .62s cubic-bezier(.15,.85,.2,1);
}

@keyframes jump{
  0%{
    transform:translateY(0) scale(1);
  }

  18%{
    transform:translateY(5px) scale(1.08,.9);
  }

  45%{
    transform:translateY(-115px) scale(.9,1.1) rotate(-4deg);
  }

  68%{
    transform:translateY(-100px) scale(.9,1.1) rotate(4deg);
  }

  100%{
    transform:translateY(0) scale(1);
  }
}

.frog-body{
  position:absolute;
  left:30px;
  top:70px;
  width:220px;
  height:160px;
  border-radius:47%;
  background:
    radial-gradient(circle at 27% 25%,#e0ff9b 0 4%,transparent 5%),
    radial-gradient(circle at 73% 28%,#caff8d 0 3%,transparent 4%),
    radial-gradient(circle at 40% 75%,#1c743d 0 10%,transparent 11%),
    linear-gradient(145deg,#91df55,#4db747 42%,#218344);
  border:5px solid #176137;
  box-shadow:
    inset 14px 12px 25px #e1ff9d44,
    inset -15px -25px 35px #003c234d;
}

.frog-body:before{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:45%;
  background:
    radial-gradient(circle at 20% 30%,#1f773c 0 3px,transparent 4px),
    radial-gradient(circle at 75% 40%,#2c883f 0 4px,transparent 5px),
    radial-gradient(circle at 60% 70%,#257b3a 0 3px,transparent 4px),
    radial-gradient(circle at 35% 65%,#2d883e 0 3px,transparent 4px);
  opacity:.55;
}

.frog-belly{
  position:absolute;
  left:43px;
  bottom:12px;
  width:135px;
  height:70px;
  border-radius:50%;
  background:radial-gradient(ellipse,#d5ed9b,#a8d968 55%,#71ad4e);
  animation:belly 2.8s ease-in-out infinite;
}

@keyframes belly{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04,.97);
  }
}

.eye-socket{
  position:absolute;
  top:12px;
  width:85px;
  height:82px;
  border-radius:50%;
  background:linear-gradient(145deg,#78c84d,#287a3c);
  border:5px solid #155b35;
  box-shadow:
    inset 0 8px 12px #dcff9633,
    0 5px 9px #00281438;
  z-index:5;
}

.eye-socket.left{
  left:10px;
}

.eye-socket.right{
  right:10px;
}

.real-eye{
  position:absolute;
  left:15px;
  top:12px;
  width:54px;
  height:54px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #050908 0 14%,
      #101c0f 15% 27%,
      #d9e996 28% 52%,
      #789047 53% 75%,
      #344b29 76%
    );
  border:3px solid #203d24;
  box-shadow:inset 0 4px 6px #fff5;
  transition:transform .08s linear;
}

.real-eye:before{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  left:11px;
  top:9px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px white;
}

.eye-lid{
  position:absolute;
  left:5px;
  top:-2px;
  width:75px;
  height:25px;
  border-radius:50%;
  background:#4ba947;
  z-index:8;
  transform-origin:center top;
  animation:blink 7s infinite;
}

@keyframes blink{
  0%,91%,100%{
    transform:scaleY(0);
  }

  94%,97%{
    transform:scaleY(1);
  }
}

.frog-nose{
  position:absolute;
  left:75px;
  top:92px;
  width:70px;
  height:25px;
  border-radius:50%;
  background:linear-gradient(#78c84d66,transparent);
  z-index:8;
}

.nostril{
  position:absolute;
  top:103px;
  width:8px;
  height:5px;
  border-radius:50%;
  background:#173e29;
  z-index:10;
}

.nostril.left{
  left:93px;
}

.nostril.right{
  right:93px;
}

.real-mouth{
  position:absolute;
  left:48px;
  bottom:27px;
  width:125px;
  height:48px;
  border-bottom:7px solid #164b30;
  border-radius:0 0 60% 60%;
  z-index:12;
}

.real-mouth:after{
  content:"";
  position:absolute;
  left:20px;
  bottom:-3px;
  width:85px;
  height:5px;
  border-radius:50%;
  background:#78bf55;
}

.throat{
  position:absolute;
  left:75px;
  bottom:3px;
  width:75px;
  height:43px;
  border-radius:50%;
  background:radial-gradient(ellipse,#72bb58,#3d9348);
  animation:throat 2.8s ease-in-out infinite;
}

@keyframes throat{
  0%,100%{
    transform:scaleY(.82);
  }

  50%{
    transform:scaleY(1.1);
  }
}

.frog-foot{
  position:absolute;
  bottom:-15px;
  width:105px;
  height:70px;
  border-radius:50%;
  background:linear-gradient(145deg,#5fc94c,#278b40);
  border:4px solid #1d6638;
  z-index:1;
}

.frog-foot.left{
  left:-5px;
  transform:rotate(12deg);
}

.frog-foot.right{
  right:-5px;
  transform:rotate(-12deg);
}

.frog-toe{
  position:absolute;
  bottom:-9px;
  width:29px;
  height:22px;
  border-radius:50%;
  background:#70d35c;
  border:3px solid #226d3c;
}

.t1{
  left:-10px;
}

.t2{
  left:18px;
}

.t3{
  right:18px;
}

.t4{
  right:-10px;
}

/* =========================
   SKINS
========================= */

.skin-golden .frog-body{
  background:
    radial-gradient(circle at 30% 20%,#fffbd1 0 4%,transparent 5%),
    linear-gradient(145deg,#fff16b,#e5a51e,#a86b12);
}

.skin-blue .frog-body{
  background:
    radial-gradient(circle at 28% 30%,#eaffff 0 4%,transparent 5%),
    linear-gradient(145deg,#82f5ff,#299bd0,#145d9d);
}

.skin-red .frog-body{
  background:
    radial-gradient(circle at 28% 25%,#ffd1c8 0 4%,transparent 5%),
    linear-gradient(145deg,#ff8b76,#df3f40,#871e35);
}

.frog.poison .frog-body{
  background:
    radial-gradient(circle at 25% 25%,#ffe900 0 7px,transparent 8px),
    radial-gradient(circle at 72% 31%,#ff304d 0 8px,transparent 9px),
    radial-gradient(circle at 46% 70%,#16c9ff 0 7px,transparent 8px),
    radial-gradient(circle at 78% 72%,#ffd400 0 5px,transparent 6px),
    linear-gradient(145deg,#148550,#062f29);

  box-shadow:
    inset 14px 12px 25px #8cffdb33,
    0 0 25px #20ff8266;
}

/* =========================
   PARTICLES
========================= */

.particle{
  position:fixed;
  pointer-events:none;
  z-index:999;
  font-weight:1000;
  color:#fff;
  text-shadow:0 2px 5px #003c27;
  animation:particle .8s ease-out forwards;
}

@keyframes particle{
  to{
    transform:
      translate(var(--x),var(--y))
      scale(.7);
    opacity:0;
  }
}

/* =========================
   UI
========================= */

.tabs{
  display:flex;
  gap:5px;
  margin-bottom:10px;
}

.tab{
  flex:1;
  padding:9px;
  border-radius:11px;
  background:#e2f2df;
  color:#285637;
  font-size:11px;
  font-weight:900;
  text-align:center;
  cursor:pointer;
}

.tab.active{
  background:#39a852;
  color:white;
}

.tabpage{
  display:none;
}

.tabpage.active{
  display:block;
}

.action{
  width:100%;
  padding:11px;
  margin:4px 0;
  border-radius:11px;
  background:#3ba952;
  color:white;
  font-weight:900;
  box-shadow:0 3px 0 #267638;
}

.action:hover{
  filter:brightness(1.06);
}

.action:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #267638;
}

.action.gold{
  background:#e9b927;
  box-shadow:0 3px 0 #a57910;
}

.action.red{
  background:#d64a4a;
  box-shadow:0 3px 0 #913333;
}

.action.dark{
  background:#244e39;
  box-shadow:0 3px 0 #153024;
}

input{
  width:100%;
  padding:10px;
  border:1px solid #bfd5c0;
  border-radius:10px;
  outline:none;
  background:white;
}

input:focus{
  border-color:#4caf50;
  box-shadow:0 0 0 3px #4caf5020;
}

.progress{
  height:11px;
  overflow:hidden;
  border-radius:20px;
  background:#dceadc;
}

.progress>div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#40b74e,#b2f34c);
  transition:.3s;
}

.card{
  padding:10px;
  border-radius:13px;
  background:#eef8eb;
  margin:7px 0;
  border:1px solid #d3e6d1;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.mini{
  font-size:10px;
  color:#708171;
}

.log{
  max-height:150px;
  overflow:auto;
  font:10px monospace;
  color:#baf6bf;
  background:#102d20;
  padding:8px;
  border-radius:10px;
}

.log div{
  padding:3px 0;
  border-bottom:1px solid #ffffff0c;
}

/* =========================
   SKINS
========================= */

.skin{
  padding:10px;
  margin:6px 0;
  border-radius:13px;
  background:#eef8eb;
  border:2px solid transparent;
  cursor:pointer;
}

.skin:hover{
  background:#e2f4df;
}

.skin.selected{
  border-color:#43ad4e;
}

.skin.locked{
  opacity:.5;
}

.skin-icon{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#55b74b;
  font-size:25px;
}

/* =========================
   FRIENDS
========================= */

.friend{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px;
  margin:5px 0;
  background:#eef8eb;
  border-radius:12px;
}

.avatar{
  width:39px;
  height:39px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#cdecc8;
  font-size:22px;
}

.friend-info{
  flex:1;
  min-width:0;
}

.friend-name{
  font-weight:900;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.friend-status{
  font-size:9px;
  color:#748175;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4ad15b;
}

.dot.off{
  background:#929d94;
}

/* =========================
   CLAN
========================= */

.clan{
  overflow:hidden;
  border-radius:15px;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#79e878,transparent 28%),
    linear-gradient(135deg,#164f31,#2d8b51);
  padding:15px;
}

.clan h3{
  margin:0;
}

.clan-tag{
  font-size:10px;
  opacity:.7;
}

.clanbar{
  height:9px;
  background:#ffffff2b;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.clanbar div{
  height:100%;
  background:#e8ff73;
}

.member{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px;
  border-bottom:1px solid #d7e5d5;
}

.member:last-child{
  border:0;
}

.member .avatar{
  width:34px;
  height:34px;
}

.role{
  margin-left:auto;
  padding:4px 6px;
  background:#e4f0e1;
  border-radius:6px;
  font-size:9px;
  font-weight:900;
}

/* =========================
   ACHIEVEMENTS
========================= */

.achievement{
  padding:9px;
  margin:5px 0;
  border-radius:11px;
  background:#edf8eb;
}

.achievement.done{
  background:#d7f5ca;
  border:1px solid #7dcc65;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:1000;
  padding:12px 16px;
  border-radius:13px;
  background:#163e2b;
  color:white;
  font-size:12px;
  font-weight:900;
  box-shadow:0 15px 40px #0004;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div id="app">

<header class="top">

  <div class="logo">
    🐸 Frog Clicker
  </div>

  <div class="stats">

    <div class="stat">
      🪙 <b id="coins">0</b>
    </div>

    <div class="stat">
      ⭐ Lv <b id="level">1</b>
    </div>

    <div class="stat">
      👆 <b id="clicks">0</b>
    </div>

    <div class="stat">
      🏆 <b id="achievements">0</b>
    </div>

  </div>

</header>


<div class="main">

<div>

<section class="panel">

  <div class="pond">

    <div class="pond-text">
      <h1>Your Pond</h1>
      <span>Click your frog • Unlimited energy</span>
    </div>

    <div class="lilypad lp1"></div>
    <div class="lilypad lp2"></div>
    <div class="lilypad lp3"></div>

    <div class="frog-stage">

      <div class="frog-shadow"></div>

      <div
        id="frog"
        class="frog"
        onclick="clickFrog(event)"
        aria-label="Click frog"
        role="button"
        tabindex="0"
      >

        <div class="frog-foot left">
          <div class="frog-toe t1"></div>
          <div class="frog-toe t2"></div>
        </div>

        <div class="frog-foot right">
          <div class="frog-toe t3"></div>
          <div class="frog-toe t4"></div>
        </div>

        <div class="frog-body">

          <div class="frog-belly"></div>

          <div class="eye-socket left">
            <div class="real-eye"></div>
            <div class="eye-lid"></div>
          </div>

          <div class="eye-socket right">
            <div class="real-eye"></div>
            <div class="eye-lid"></div>
          </div>

          <div class="frog-nose"></div>

          <div class="nostril left"></div>
          <div class="nostril right"></div>

          <div class="real-mouth"></div>
          <div class="throat"></div>

        </div>

      </div>

    </div>

  </div>

</section>


<section class="panel">

  <div class="panel-title">
    <h2>⚡ Game Mechanics</h2>
    <span class="small">No energy system</span>
  </div>

  <div class="card">

    <div class="row">
      <b>Click Power</b>
      <b id="power">1</b>
    </div>

    <div class="mini">
      Coins earned per frog click
    </div>

  </div>

  <button
    class="action"
    onclick="upgradePower()"
  >
    🪙 Upgrade Click Power
  </button>

  <button
    class="action gold"
    onclick="buyAutoFrog()"
  >
    🤖 Buy Auto Frog
  </button>

  <button
    class="action dark"
    onclick="prestige()"
  >
    🌟 Pond Rebirth
  </button>

</section>

</div>


<div>

<section class="panel">

  <div class="tabs">

    <div
      class="tab active"
      onclick="tab('skins',this)"
    >
      🎨 Skins
    </div>

    <div
      class="tab"
      onclick="tab('social',this)"
    >
      👥 Social
    </div>

    <div
      class="tab"
      onclick="tab('clan',this)"
    >
      🏰 Clan
    </div>

  </div>


<div
  id="skins"
  class="tabpage active"
>

  <div id="skinList"></div>

</div>


<div
  id="social"
  class="tabpage"
>

  <h3>👥 Friends</h3>

  <div class="row">

    <input
      id="friendInput"
      placeholder="Frog username"
      maxlength="24"
    >

    <button
      class="action"
      style="width:auto"
      onclick="addFriend()"
    >
      Add
    </button>

  </div>

  <div id="friends"></div>

  <h3>📨 Requests</h3>

  <div id="requests"></div>

</div>


<div
  id="clan"
  class="tabpage"
>

  <div id="clanArea"></div>

</div>

</section>


<section class="panel">

<script>

/* ============================================================

const SKINS = [

/* ============================================================
   BASIC HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function finiteNumber(value,fallback=0){

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : fallback;
}

function positiveNumber(value,fallback=0){

  const number =
    finiteNumber(
      value,
      fallback
    );

  return number < 0
    ? fallback
    : number;
}

function format(number){

  number =
    positiveNumber(
      number,
      0
    );

  if(number >= 1e15){
    return (
      number / 1e15
    ).toFixed(2)+"Q";
  }

  if(number >= 1e12){
    return (
      number / 1e12
    ).toFixed(2)+"T";
  }

  if(number >= 1e9){
    return (
      number / 1e9
    ).toFixed(2)+"B";
  }

  if(number >= 1e6){
    return (
      number / 1e6
    ).toFixed(2)+"M";
  }

  if(number >= 1e3){
    return (
      number / 1e3
    ).toFixed(1)+"K";
  }

  return Math.floor(number)
    .toLocaleString();
}

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ============================================================
   TOAST
============================================================ */

let toastTimer = null;

function toast(message){

  const element =
    $("toast");

  if(!element)
    return;

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        element.classList.remove(
          "show"
        );
      },
      2200
    );
}


/* ============================================================
   LOG
============================================================ */

function log(message){

  const box =
    $("log");

  if(!box)
    return;

  const item =
    document.createElement(
      "div"
    );

  item.textContent =
    new Date()
      .toLocaleTimeString()+
    " • "+
    message;

  box.prepend(item);

  while(
    box.children.length > 40
  ){

    box.lastElementChild.remove();

  }
}


/* ============================================================
   SAFE SAVE
============================================================ */

function save(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(G)
    );

  }catch(error){

    console.warn(
      "Game could not be saved:",
      error
    );

  }
}


/* ============================================================
   SAFE LOAD + MIGRATION
============================================================ */

function load(){

  let raw = null;

  try{

    raw =
      localStorage.getItem(
        SAVE_KEY
      );

  }catch(error){

    console.warn(
      "localStorage unavailable:",
      error
    );

    return;

  }

  if(!raw)
    return;

  try{

    const saved =
      JSON.parse(raw);

    if(
      !saved ||
      typeof saved !== "object"
    ){

      return;

    }

    /*
      Only copy known primitive/object
      structures. This prevents a broken
      save from replacing the whole game.
    */

    const numericFields = [
      "coins",
      "clicks",
      "level",
      "xp",
      "power",
      "auto",
      "rebirths"
    ];

    numericFields.forEach(
      key=>{

        if(
          Object.prototype.hasOwnProperty.call(
            saved,
            key
          )
        ){

          const value =
            finiteNumber(
              saved[key],
              G[key]
            );

          G[key] =
            Math.max(
              0,
              value
            );

        }

      }
    );


    if(
      typeof saved.skin === "string" &&
      SKINS.some(
        skin=>
          skin.id === saved.skin
      )
    ){

      G.skin =
        saved.skin;

    }


    if(
      saved.unlocked &&
      typeof saved.unlocked === "object"
    ){

      G.unlocked = {
        classic:true
      };

      Object.keys(
        saved.unlocked
      ).forEach(
        key=>{

          if(
            SKINS.some(
              skin=>
                skin.id === key
            )
          ){

            G.unlocked[key] =
              Boolean(
                saved.unlocked[key]
              );

          }

        }
      );

    }


    if(
      Array.isArray(
        saved.friends
      )
    ){

      G.friends =
        saved.friends
          .filter(
            friend=>
              friend &&
              typeof friend.name === "string"
          )
          .slice(0,100)
          .map(
            friend=>({
              name:
                friend.name
                  .slice(0,24),

              level:
                clamp(
                  Math.floor(
                    finiteNumber(
                      friend.level,
                      1
                    )
                  ),
                  1,
                  999999
                ),

              online:
                Boolean(
                  friend.online
                )
            })
          );

    }


    if(
      Array.isArray(
        saved.requests
      )
    ){

      G.requests =
        saved.requests
          .filter(
            request=>
              request &&
              typeof request.name === "string"
          )
          .slice(0,100)
          .map(
            request=>({
              name:
                request.name
                  .slice(0,24),

              level:
                clamp(
                  Math.floor(
                    finiteNumber(
                      request.level,
                      1
                    )
                  ),
                  1,
                  999999
                ),

              online:
                Boolean(
                  request.online
                )
            })
          );

    }


    if(
      saved.achievements &&
      typeof saved.achievements === "object"
    ){

      G.achievements = {};

      ACHIEVEMENTS.forEach(
        achievement=>{

          const id =
            achievement[0];

          if(
            saved.achievements[id]
          ){

            G.achievements[id] =
              true;

          }

        }
      );

    }


    if(
      saved.statistics &&
      typeof saved.statistics === "object"
    ){

      G.statistics = {
        ...DEFAULT_STATS
      };

      Object.keys(
        DEFAULT_STATS
      ).forEach(
        key=>{

          G.statistics[key] =
            positiveNumber(
              saved.statistics[key],
              DEFAULT_STATS[key]
            );

        }
      );

    }


    if(
      saved.clan &&
      typeof saved.clan === "object"
    ){

      if(
        typeof saved.clan.name === "string" &&
        typeof saved.clan.tag === "string"
      ){

        G.clan = {

          name:
            saved.clan.name
              .slice(0,30),

          tag:
            saved.clan.tag
              .slice(0,5)
              .toUpperCase(),

          level:
            Math.max(
              1,
              Math.floor(
                finiteNumber(
                  saved.clan.level,
                  1
                )
              )
            ),

          xp:
            positiveNumber(
              saved.clan.xp,
              0
            ),

          members:
            Array.isArray(
              saved.clan.members
            )
              ? saved.clan.members
                  .filter(
                    member=>
                      member &&
                      typeof member.name==="string"
                  )
                  .slice(0,50)
              : [],

          feed:
            Array.isArray(
              saved.clan.feed
            )
              ? saved.clan.feed
                  .filter(
                    item=>
                      typeof item==="string"
                  )
                  .slice(0,30)
              : []

        };

      }

    }

  }catch(error){

    console.warn(
      "Save was corrupted. Starting with safe defaults.",
      error
    );

  }

  repairGame();
}


/* ============================================================
   REPAIR GAME
============================================================ */

function repairGame(){

  G.coins =
    positiveNumber(
      G.coins,
      0
    );

  G.clicks =
    Math.floor(
      positiveNumber(
        G.clicks,
        0
      )
    );

  G.level =
    Math.max(
      1,
      Math.floor(
        positiveNumber(
          G.level,
          1
        )
      )
    );

  G.xp =
    positiveNumber(
      G.xp,
      0
    );

  G.power =
    Math.max(
      1,
      Math.floor(
        positiveNumber(
          G.power,
          1
        )
      )
    );

  G.auto =
    Math.floor(
      positiveNumber(
        G.auto,
        0
      )
    );

  G.rebirths =
    Math.floor(
      positiveNumber(
        G.rebirths,
        0
      )
    );


  if(
    !G.unlocked ||
    typeof G.unlocked !== "object"
  ){

    G.unlocked = {};

  }

  G.unlocked.classic = true;


  if(
    !SKINS.some(
      skin=>
        skin.id === G.skin
    )
  ){

    G.skin =
      "classic";

  }


  if(
    !G.friends ||
    !Array.isArray(
      G.friends
    )
  ){

    G.friends = [];

  }


  if(
    !G.requests ||
    !Array.isArray(
      G.requests
    )
  ){

    G.requests = [];

  }


  if(
    !G.achievements ||
    typeof G.achievements !== "object"
  ){

    G.achievements = {};

  }


  if(
    !G.statistics ||
    typeof G.statistics !== "object"
  ){

    G.statistics = {};

  }


  Object.keys(
    DEFAULT_STATS
  ).forEach(
    key=>{

      G.statistics[key] =
        positiveNumber(
          G.statistics[key],
          DEFAULT_STATS[key]
        );

    }
  );


  if(
    G.clan &&
    typeof G.clan === "object"
  ){

    G.clan.level =
      Math.max(
        1,
        Math.floor(
          positiveNumber(
            G.clan.level,
            1
          )
        )
      );

    G.clan.xp =
      positiveNumber(
        G.clan.xp,
        0
      );

    if(
      !Array.isArray(
        G.clan.members
      )
    ){

      G.clan.members = [];

    }

    if(
      !Array.isArray(
        G.clan.feed
      )
    ){

      G.clan.feed = [];

    }

  }

}


/* ============================================================
   XP
============================================================ */

function xpRequired(){

  return Math.floor(
    100 *
    Math.pow(
      1.35,
      G.level - 1
    )
  );

}

function addXP(amount){

  amount =
    positiveNumber(
      amount,
      0
    );

  G.xp += amount;

  let safety = 0;

  while(
    G.xp >= xpRequired() &&
    safety < 1000
  ){

    G.xp -= xpRequired();

    G.level++;

    G.power++;

    toast(
      "⭐ Level "+G.level+"!"
    );

    log(
      "Reached level "+
      G.level
    );

    safety++;

  }

}


/* ============================================================
   CLICKING
============================================================ */

function clickFrog(event){

  const earned =
    Math.max(
      1,
      Math.floor(
        finiteNumber(
          G.power,
          1
        )
      )
    );

  G.coins += earned;

  G.clicks++;

  G.statistics.totalCoins +=
    earned;

  G.statistics.biggestClick =
    Math.max(
      G.statistics.biggestClick,
      earned
    );

  addXP(
    Math.max(
      1,
      Math.ceil(
        earned / 3
      )
    )
  );

  animateFrog();

  if(event){

    particle(
      event.clientX,
      event.clientY,
      "+"+format(earned)
    );

  }

  checkAchievements();

  update();

  save();

}


/* ============================================================
   KEYBOARD ACCESS
============================================================ */

$("frog").addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      clickFrog({
        clientX:
          window.innerWidth/2,

        clientY:
          window.innerHeight/2
      });

    }

  }
);


/* ============================================================
   FROG ANIMATION
============================================================ */

function animateFrog(){

  const frog =
    $("frog");

  if(!frog)
    return;

  frog.classList.remove(
    "jump"
  );

  void frog.offsetWidth;

  frog.classList.add(
    "jump"
  );

  setTimeout(
    ()=>{
      frog.classList.remove(
        "jump"
      );
    },
    700
  );

}


/* ============================================================
   PARTICLES
============================================================ */

function particle(x,y,text){

  const p =
    document.createElement(
      "div"
    );

  p.className =
    "particle";

  p.textContent =
    text;

  p.style.left =
    x+"px";

  p.style.top =
    y+"px";

  p.style.setProperty(
    "--x",
    (Math.random()*80-40)+"px"
  );

  p.style.setProperty(
    "--y",
    (-70-Math.random()*80)+"px"
  );

  document.body.appendChild(
    p
  );

  setTimeout(
    ()=>{
      p.remove();
    },
    850
  );

}


/* ============================================================
   UPGRADES
============================================================ */

function powerUpgradeCost(){

  return Math.floor(
    50 *
    Math.pow(
      1.55,
      Math.max(
        0,
        G.power-1
      )
    )
  );

}

function autoCost(){

  return Math.floor(
    1000 *
    Math.pow(
      1.7,
      Math.max(
        0,
        G.auto
      )
    )
  );

}


function upgradePower(){

  const cost =
    powerUpgradeCost();

  if(
    G.coins < cost
  ){

    toast(
      "You need "+
      format(cost)+
      " coins."
    );

    return;

  }

  G.coins -= cost;

  G.power++;

  toast(
    "💪 Click Power: "+
    G.power
  );

  log(
    "Upgraded Click Power to "+
    G.power
  );

  checkAchievements();

  update();

  save();

}


function buyAutoFrog(){

  const cost =
    autoCost();

  if(
    G.coins < cost
  ){

    toast(
      "You need "+
      format(cost)+
      " coins."
    );

    return;

  }

  G.coins -= cost;

  G.auto++;

  toast(
    "🤖 Auto Frog purchased!"
  );

  log(
    "Bought Auto Frog #"+
    G.auto
  );

  checkAchievements();

  update();

  save();

}


/* ============================================================
   AUTO FROGS
============================================================ */

setInterval(
  ()=>{

    if(G.auto <= 0)
      return;

    const earned =
      Math.max(
        1,
        G.auto *
        Math.max(
          1,
          G.power
        )
      );

    G.coins += earned;

    G.statistics.totalCoins +=
      earned;

    addXP(
      Math.max(
        1,
        Math.floor(
          G.auto / 2
        )
      )
    );

    checkAchievements();

    update();

    save();

  },
  1000
);


/* ============================================================
   REBIRTH
============================================================ */

function prestige(){

  if(
    G.level < 25
  ){

    toast(
      "Reach level 25 first."
    );

    return;

  }

  const confirmed =
    window.confirm(
      "Rebirth resets coins, level, power and Auto Frogs, but increases your permanent starting power. Continue?"
    );

  if(!confirmed)
    return;

  G.rebirths++;

  G.coins = 0;

  G.level = 1;

  G.xp = 0;

  G.power =
    1 + G.rebirths;

  G.auto = 0;

  toast(
    "🌟 Pond reborn!"
  );

  log(
    "Performed Pond Rebirth #"+
    G.rebirths
  );

  checkAchievements();

  update();

  save();

}


/* ============================================================
   SKINS
============================================================ */

function renderSkins(){

  const box =
    $("skinList");

  if(!box)
    return;

  box.innerHTML =
    SKINS.map(
      skin=>{

        const unlocked =
          Boolean(
            G.unlocked[
              skin.id
            ]
          );

        const selected =
          G.skin === skin.id;

        return `

          <div
            class="skin
              ${selected?"selected":""}
              ${unlocked?"":"locked"}"
            onclick="selectSkin('${skin.id}')"
          >

            <div class="row">

              <div
                style="
                  display:flex;
                  gap:9px;
                  align-items:center
                "
              >

                <div class="skin-icon">
                  ${skin.icon}
                </div>

                <div>

                  <b>
                    ${escapeHTML(
                      skin.name
                    )}
                  </b>

                  <div class="mini">
                    ${escapeHTML(
                      skin.description
                    )}
                  </div>

                </div>

              </div>

              <b>
                ${
                  unlocked
                    ? "✓"
                    : format(skin.price)
                }
              </b>

            </div>

          </div>

        `;

      }
    ).join("");

}


function selectSkin(id){

  const skin =
    SKINS.find(
      item=>
        item.id === id
    );

  if(!skin)
    return;

  if(
    !G.unlocked[id]
  ){

    if(
      G.coins < skin.price
    ){

      toast(
        "You need "+
        format(skin.price)+
        " coins."
      );

      return;

    }

    G.coins -=
      skin.price;

    G.unlocked[id] =
      true;

    G.statistics.skinsBought++;

    toast(
      "🎨 Unlocked "+
      skin.name
    );

    log(
      "Unlocked "+
      skin.name
    );

  }

  G.skin = id;

  applySkin();

  renderSkins();

  checkAchievements();

  update();

  save();

}


function applySkin(){

  const frog =
    $("frog");

  if(!frog)
    return;

  frog.className =
    "frog";

  const skin =
    SKINS.find(
      item=>
        item.id === G.skin
    );

  if(
    skin &&
    skin.className
  ){

    frog.classList.add(
      skin.className
    );

  }

}


/* ============================================================
   TABS
============================================================ */

function tab(id,element){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      item=>
        item.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(
      ".tabpage"
    )
    .forEach(
      item=>
        item.classList.remove(
          "active"
        )
    );

  if(element){

    element.classList.add(
      "active"
    );

  }

  const page =
    $(id);

  if(page){

    page.classList.add(
      "active"
    );

  }

}


/* ============================================================
   FRIENDS
============================================================ */

function addFriend(){

  const input =
    $("friendInput");

  if(!input)
    return;

  const name =
    input.value
      .trim()
      .slice(0,24);

  if(!name){

    toast(
      "Enter a frog username."
    );

    return;

  }

  if(
    G.friends.some(
      friend=>
        friend.name
          .toLowerCase() ===
        name.toLowerCase()
    )
  ){

    toast(
      "Already your friend."
    );

    return;

  }

  G.friends.push({

    name:name,

    level:
      1 +
      Math.floor(
        Math.random()*30
      ),

    online:
      Math.random() > .3

  });

  G.statistics.friendsAdded++;

  input.value = "";

  renderFriends();

  checkAchievements();

  save();

  toast(
    "👥 Added "+name
  );

}


function renderFriends(){

  const box =
    $("friends");

  if(!box)
    return;

  if(
    G.friends.length === 0
  ){

    box.innerHTML =
      `<div class="card">
        No friends yet.
      </div>`;

    return;

  }

  box.innerHTML =
    G.friends.map(
      (friend,index)=>`

        <div class="friend">

          <div class="avatar">
            🐸
          </div>

          <div class="friend-info">

            <div class="friend-name">
              ${escapeHTML(
                friend.name
              )}
            </div>

            <div class="friend-status">

              <span
                class="dot
                ${friend.online?"":"off"}"
              ></span>

              ${
                friend.online
                  ? "Online"
                  : "Offline"
              }

              • Level ${friend.level}

            </div>

          </div>

          <button
            class="action red"
            style="width:auto"
            onclick="removeFriend(${index})"
          >
            ×
          </button>

        </div>

      `
    ).join("");

}


function removeFriend(index){

  if(
    !Number.isInteger(index) ||
    index < 0 ||
    index >= G.friends.length
  ){

    return;

  }

  const name =
    G.friends[index].name;

  G.friends.splice(
    index,
    1
  );

  renderFriends();

  save();

  toast(
    name+
    " removed."
  );

}


function renderRequests(){

  const box =
    $("requests");

  if(!box)
    return;

  if(
    G.requests.length === 0
  ){

    box.innerHTML =
      `<div class="card">
        No requests.
      </div>`;

    return;

  }

  box.innerHTML =
    G.requests.map(
      (request,index)=>`

        <div class="friend">

          <div class="avatar">
            🐸
          </div>

          <div class="friend-info">

            <div class="friend-name">
              ${escapeHTML(
                request.name
              )}
            </div>

            <div class="friend-status">
              Level ${request.level}
            </div>

          </div>

          <button
            class="action"
            style="width:auto"
            onclick="acceptRequest(${index})"
          >
            ✓
          </button>

        </div>

      `
    ).join("");

}


function acceptRequest(index){

  if(
    !Number.isInteger(index) ||
    index < 0 ||
    index >= G.requests.length
  ){

    return;

  }

  const request =
    G.requests[index];

  if(
    G.friends.some(
      friend=>
        friend.name.toLowerCase() ===
        request.name.toLowerCase()
    )
  ){

    G.requests.splice(
      index,
      1
    );

    renderRequests();

    save();

    return;

  }

  G.friends.push({
    name:
      request.name,
    level:
      request.level,
    online:
      request.online
  });

  G.requests.splice(
    index,
    1
  );

  renderFriends();
  renderRequests();

  checkAchievements();

  save();

  toast(
    "👥 Friend accepted!"
  );

}


/* ============================================================
   CLANS
============================================================ */

function clanXPRequired(){

  if(!G.clan)
    return 1000;

  return Math.floor(
    1000 *
    Math.pow(
      1.45,
      Math.max(
        0,
        G.clan.level - 1
      )
    )
  );

}


function createClan(){

  if(G.clan){

    toast(
      "You already have a clan."
    );

    return;

  }

  const nameInput =
    $("newClanName");

  const tagInput =
    $("newClanTag");

  if(
    !nameInput ||
    !tagInput
  ){

    return;

  }

  const name =
    nameInput.value
      .trim()
      .slice(0,30);

  const tag =
    tagInput.value
      .trim()
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      )
      .slice(0,5);

  if(
    !name ||
    !tag
  ){

    toast(
      "Enter a clan name and tag."
    );

    return;

  }

  G.clan = {

    name:name,

    tag:tag,

    level:1,

    xp:0,

    members:[

      {
        name:"You",
        role:"Leader",
        level:G.level
      },

      {
        name:"LilyHopper",
        role:"Officer",
        level:17
      },

      {
        name:"BogMaster",
        role:"Member",
        level:11
      },

      {
        name:"TinyTadpole",
        role:"Member",
        level:6
      }

    ],

    feed:[
      "You created the clan."
    ]

  };

  G.statistics.clanCreated++;

  checkAchievements();

  renderClan();

  save();

  toast(
    "🏰 Clan created!"
  );

}


function donateClan(){

  if(!G.clan){

    toast(
      "Create a clan first."
    );

    return;

  }

  const maximum =
    Math.floor(
      positiveNumber(
        G.coins,
        0
      ) * .05
    );

  const amount =
    Math.min(
      G.coins,
      Math.max(
        100,
        maximum
      )
    );

  if(
    amount < 100
  ){

    toast(
      "You need at least 100 coins."
    );

    return;

  }

  G.coins -= amount;

  G.clan.xp += amount;

  G.statistics.clanDonations++;

  G.clan.feed.unshift(
    "You donated "+
    format(amount)+
    " coins."
  );

  while(
    G.clan.xp >=
    clanXPRequired()
  ){

    G.clan.xp -=
      clanXPRequired();

    G.clan.level++;

    G.clan.feed.unshift(
      "🏆 Clan reached level "+
      G.clan.level+"!"
    );

    toast(
      "🏆 Clan Level Up!"
    );

  }

  G.clan.feed =
    G.clan.feed.slice(
      0,
      30
    );

  checkAchievements();

  renderClan();

  update();

  save();

}


function leaveClan(){

  if(!G.clan)
    return;

  if(
    !window.confirm(
      "Leave your clan?"
    )
  ){

    return;

  }

  G.clan = null;

  renderClan();

  save();

  toast(
    "You left the clan."
  );

}


function renderClan(){

  const box =
    $("clanArea");

  if(!box)
    return;

  if(!G.clan){

    box.innerHTML = `

      <div class="card">

        <h3>🏰 Create a Clan</h3>

        <p class="mini">
          Build a frog community and
          level your clan together.
        </p>

        <input
          id="newClanName"
          placeholder="Clan name"
          maxlength="30"
        >

        <br><br>

        <input
          id="newClanTag"
          placeholder="Tag"
          maxlength="5"
        >

        <button
          class="action"
          onclick="createClan()"
        >
          Create Clan
        </button>

      </div>

    `;

    return;

  }

  const required =
    clanXPRequired();

  const percent =
    clamp(
      G.clan.xp /
      required *
      100,
      0,
      100
    );

  box.innerHTML = `

    <div class="clan">

      <h3>
        🐸 ${escapeHTML(
          G.clan.name
        )}
      </h3>

      <div class="clan-tag">
        [${escapeHTML(
          G.clan.tag
        )}]
      </div>

      <div style="margin-top:10px">
        Clan Level ${G.clan.level}
      </div>

      <div
        class="mini"
        style="color:white"
      >
        ${format(G.clan.xp)}
        /
        ${format(required)}
        XP
      </div>

      <div class="clanbar">
        <div
          style="width:${percent}%"
        ></div>
      </div>

    </div>

    <button
      class="action"
      onclick="donateClan()"
    >
      🍃 Donate Coins
    </button>

    <button
      class="action dark"
      onclick="leaveClan()"
    >
      Leave Clan
    </button>

    <h3>👥 Members</h3>

    ${
      G.clan.members.map(
        member=>`

          <div class="member">

            <div class="avatar">
              🐸
            </div>

            <div style="flex:1">

              <b>
                ${escapeHTML(
                  member.name
                )}
              </b>

              <div class="mini">
                Level ${
                  finiteNumber(
                    member.level,
                    1
                  )
                }
              </div>

            </div>

            <span class="role">
              ${escapeHTML(
                member.role || "Member"
              )}
            </span>

          </div>

        `
      ).join("")
    }

    <h3>📜 Clan Feed</h3>

    <div class="log">

      ${
        G.clan.feed
          .map(
            item=>
              `<div>
                ${escapeHTML(item)}
              </div>`
          )
          .join("")
      }

    </div>

  `;

}


/* ============================================================
   ACHIEVEMENTS
============================================================ */

function checkAchievements(){

  const checks = {

    first:
      G.clicks >= 1,

    "100":
      G.clicks >= 100,

    "1000":
      G.clicks >= 1000,

    "10000":
      G.clicks >= 10000,

    million:
      G.statistics.totalCoins >= 1000000,

    power10:
      G.power >= 10,

    power50:
      G.power >= 50,

    auto:
      G.auto >= 1,

    rebirth:
      G.rebirths >= 1,

    skins:
      G.statistics.skinsBought >= 1,

    poison:
      Boolean(
        G.unlocked.poison
      ),

    friend:
      G.friends.length >= 1,

    clan:
      Boolean(G.clan),

    donate:
      G.statistics.clanDonations >= 1

  };


  ACHIEVEMENTS.forEach(
    achievement=>{

      const id =
        achievement[0];

      if(
        checks[id] &&
        !G.achievements[id]
      ){

        G.achievements[id] =
          true;

        toast(
          "🏆 Achievement: "+
          achievement[1]
        );

        log(
          "Achievement unlocked: "+
          achievement[1]
        );

      }

    }
  );

  renderAchievements();

}


function renderAchievements(){

  const box =
    $("achievementList");

  if(!box)
    return;

  box.innerHTML =
    ACHIEVEMENTS.map(
      achievement=>{

        const done =
          Boolean(
            G.achievements[
              achievement[0]
            ]
          );

        return `

          <div
            class="
              achievement
              ${done?"done":""}
            "
          >

            <div class="row">

              <b>
                ${done?"🏆":"🔒"}
                ${escapeHTML(
                  achievement[1]
                )}
              </b>

              <span>
                ${done?"✓":""}
              </span>

            </div>

            <div class="mini">
              ${escapeHTML(
                achievement[2]
              )}
            </div>

          </div>

        `;

      }
    ).join("");

}


/* ============================================================
   UPDATE
============================================================ */

function update(){

  $("coins").textContent =
    format(G.coins);

  $("level").textContent =
    format(G.level);

  $("clicks").textContent =
    format(G.clicks);

  $("power").textContent =
    format(G.power);

  $("achievements").textContent =
    Object.keys(
      G.achievements
    ).filter(
      key=>
        G.achievements[key]
    ).length;

}


/* ============================================================
   EYE TRACKING
============================================================ */

document.addEventListener(
  "mousemove",
  event=>{

    document
      .querySelectorAll(
        ".real-eye"
      )
      .forEach(
        eye=>{

          const rect =
            eye.getBoundingClientRect();

          const centerX =
            rect.left +
            rect.width / 2;

          const centerY =
            rect.top +
            rect.height / 2;

          const dx =
            event.clientX -
            centerX;

          const dy =
            event.clientY -
            centerY;

          const angle =
            Math.atan2(
              dy,
              dx
            );

          const distance =
            Math.min(
              7,
              Math.hypot(
                dx,
                dy
              ) / 35
            );

          eye.style.transform =
            `translate(
              ${Math.cos(angle)*distance}px,
              ${Math.sin(angle)*distance}px
            )`;

        }
      );

  }
);
