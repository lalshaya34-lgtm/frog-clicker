<!DOCTYPE html>

<title>🐸 Frog Clicker</title>

<style>
:root {
  --bg: #07140d;
  --bg2: #0b1e13;
  --panel: #10291b;
  --panel2: #0c2116;
  --border: #2f6d49;
  --green: #72e6a1;
  --green2: #3dbb70;
  --gold: #ffd76a;
  --red: #ff7d7d;
  --blue: #77c9ff;
  --purple: #d19aff;
  --text: #eaffef;
  --muted: #9bc1a7;
  --shadow: rgba(0,0,0,.35);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(
      circle at 50% -10%,
      #1b5134 0,
      var(--bg) 45%
    );
  color: var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button {
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  background: #1a4830;
}

button:active {
  transform: translateY(1px);
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

button.active {
  background: #286342;
  border-color: var(--green);
}

.app {
  width: min(1450px, 100%);
  margin: auto;
  padding: 8px;
}

/* TOP BAR */

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,20,13,.96);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 8px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 30px var(--shadow);
}

.mechanics {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 7px;
  scrollbar-width: thin;
}

.mechanics button {
  flex: 0 0 auto;
  min-height: 36px;
  padding: 6px 9px;
  font-size: 12px;
}

.stats {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.stat {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 7px 10px;
  font-size: 12px;
}

.stat b {
  color: var(--green);
}

/* MAIN */

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 410px;
  gap: 12px;
  margin-top: 12px;
}

.card {
  background: rgba(10,31,20,.96);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 14px;
  box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

/* FROG */

.frog-area {
  height: 430px;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 55%,
      #225b39 0,
      #123a25 30%,
      #081810 70%
    );
}

.frog-area::before {
  content: "🌿   🪷   🌿   🪷   🌿";
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 34px;
  opacity: .8;
}

.frog {
  position: relative;
  z-index: 2;
  font-size: 160px;
  user-select: none;
  cursor: pointer;
  transition:
    transform .08s,
    filter .2s;
  filter: drop-shadow(0 20px 18px rgba(0,0,0,.45));
}

.frog:hover {
  filter:
    drop-shadow(0 20px 18px rgba(0,0,0,.45))
    brightness(1.1);
}

.frog:active {
  transform: scale(.88) rotate(-4deg);
}

/* FLOATING NUMBERS */

.float {
  position: absolute;
  z-index: 10;
  color: var(--gold);
  font-size: 20px;
  font-weight: 900;
  pointer-events: none;
  animation: floatUp .8s ease-out forwards;
}

@keyframes floatUp {
  from {
    transform:
      translateY(0)
      scale(1);
    opacity: 1;
  }

  to {
    transform:
      translateY(-100px)
      scale(1.15);
    opacity: 0;
  }
}

/* ENERGY */

.energy-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

.energy-bar,
.xp-bar {
  height: 11px;
  background: #050d08;
  border-radius: 99px;
  overflow: hidden;
}

.energy-fill {
  width: 100%;
  height: 100%;
  background:
    linear-gradient(
      90deg,
      #35bd6c,
      #b7ed72
    );
}

.xp-fill {
  width: 0;
  height: 100%;
  background:
    linear-gradient(
      90deg,
      #8d6aff,
      #d8a0ff
    );
}

/* ACTIONS */

.actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* ITEMS */

.items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-height: 560px;
  overflow-y: auto;
}

.item {
  background: #0b2015;
  border: 1px solid #24583a;
  border-radius: 10px;
  padding: 9px;
}

.item-name {
  color: var(--green);
  font-weight: 800;
  font-size: 13px;
}

.item-info {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
  margin: 5px 0 7px;
}

/* ACTIVITY */

.activity {
  max-height: 150px;
  overflow-y: auto;
  color: var(--muted);
  font-size: 12px;
}

.activity div {
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,.03);
}

/* PANEL */

.panel-title {
  margin: 0 0 4px;
}

.description {
  color: var(--muted);
  font-size: 13px;
}

.section-title {
  margin-top: 0;
}

/* NOTIFICATIONS */

.toast {
  position: fixed;
  right: 15px;
  bottom: 15px;
  z-index: 999;
  background: #173b28;
  border: 1px solid var(--green);
  border-radius: 10px;
  padding: 10px 14px;
  max-width: 320px;
  box-shadow: 0 8px 25px #0008;
  animation: toastIn .25s ease-out;
}

@keyframes toastIn {
  from {
    transform: translateY(15px);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* BADGES */

.badge {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 99px;
  background: var(--gold);
  color: #171207;
  font-size: 11px;
  font-weight: 800;
}

/* MOBILE */

@media (max-width: 900px) {
  .main {
    grid-template-columns: 1fr;
  }

  .items {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 550px) {
  .app {
    padding: 4px;
  }

  .frog-area {
    height: 330px;
  }

  .frog {
    font-size: 115px;
  }

  .items {
    grid-template-columns: 1fr;
  }

  .stat {
    font-size: 11px;
    padding: 6px 7px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }

  .float,
  .frog {
    animation: none !important;
    transition: none !important;
  }
}

========================================================= */

function formatNumber(value) {

  if (
    !Number.isFinite(value)
  ) {
    return "0";
  }

  if (
    value >= 1e18
  ) {
    return (
      (value / 1e18)
        .toFixed(2) +
      "Qi"
    );
  }

  if (
    value >= 1e15
  ) {
    return (
      (value / 1e15)
        .toFixed(2) +
      "Qa"
    );
  }

  if (
    value >= 1e12
  ) {
    return (
      (value / 1e12)
        .toFixed(2) +
      "T"
    );
  }

  if (
    value >= 1e9
  ) {
    return (
      (value / 1e9)
        .toFixed(2) +
      "B"
    );
  }

  if (
    value >= 1e6
  ) {
    return (
      (value / 1e6)
        .toFixed(2) +
      "M"
    );
  }

  if (
    value >= 1000
  ) {
    return (
      (value / 1000)
        .toFixed(2) +
      "K"
    );
  }

  return Math.floor(value)
    .toString();
}

function log(message) {

  const activity =
    $("activity");

  const line =
    document.createElement("div");

  line.textContent =
    message;

  activity.prepend(line);

  while (
    activity.children.length >
    40
  ) {
    activity.lastChild.remove();
  }

}

/* =========================================================
   TOAST
========================================================= */

function toast(message) {

  const old =
    document.querySelector(
      ".toast"
    );

  if (old) {
    old.remove();
  }

  const element =
    document.createElement("div");

  element.className =
    "toast";

  element.textContent =
    message;

  document.body.appendChild(
    element
  );

  setTimeout(
    () => element.remove(),
    2200
  );

}

/* =========================================================
   INCOME
========================================================= */

function getIncomePerSecond() {

  let income = 0;

  for (
    let i = 0;
    i < items.length;
    i++
  ) {

    const item =
      items[i];

    income +=
      state.owned[i] *
      item.power *
      (1 +
        item.category *
        0.002);

  }

  const comboBonus =
    1 +
    Math.min(
      state.combo,
      100
    ) *
    0.005;

  return (
    income *
    state.multiplier *
    (1 +
      state.rebirths *
      0.2) *
    comboBonus
  );

}

/* =========================================================
   CLICK VALUE
========================================================= */

function getClickValue(
  basePower = 1
) {

  const comboBonus =
    1 +
    Math.min(
      state.combo,
      100
    ) *
    0.01;

  return (
    basePower *
    state.multiplier *
    comboBonus *
    (1 +
      state.rebirths *
      0.2)
  );

}

/* =========================================================
   XP
========================================================= */

function addXP(amount) {

  state.xp += amount;

  while (
    state.xp >=
    state.xpNeeded
  ) {

    state.xp -=
      state.xpNeeded;

    state.level++;

    state.xpNeeded =
      Math.floor(
        state.xpNeeded *
        1.18
      );

    state.maxEnergy += 5;

    state.energy =
      state.maxEnergy;

    toast(
      "⭐ Frog reached Level " +
      state.level + "!"
    );

    log(
      "⭐ Level up! Frog is now level " +
      state.level
    );

  }

}

/* =========================================================
   CLICK FROG
========================================================= */

function clickFrog(
  power = 1
) {

  if (
    state.energy < 1
  ) {

    log(
      "⚡ Your frog needs energy."
    );

    return;

  }

  state.energy =
    Math.max(
      0,
      state.energy - 1
    );

  state.clicks++;

  state.combo++;

  state.maxCombo =
    Math.max(
      state.maxCombo,
      state.combo
    );

  const gain =
    getClickValue(
      power
    );

  state.coins +=
    gain;

  addXP(
    Math.max(
      1,
      Math.floor(
        power
      )
    )
  );

  createFloat(
    "+" +
    formatNumber(
      gain
    ) +
    " 🌿"
  );

  updateStats();

}

/* =========================================================
   CRITICAL CLICK
========================================================= */

function criticalCroak() {

  if (
    state.energy < 5
  ) {

    log(
      "⚡ Need 5 energy."
    );

    return;

  }

  state.energy -= 5;

  state.criticals++;

  state.combo += 5;

  const gain =
    getClickValue(100) *
    10;

  state.coins +=
    gain;

  addXP(50);

  createFloat(
    "💥 CRITICAL +" +
    formatNumber(
      gain
    )
  );

  toast(
    "💥 Critical Croak!"
  );

  updateStats();

}

/* =========================================================
   FLOATING TEXT
========================================================= */

function createFloat(text) {

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "float";

  element.textContent =
    text;

  element.style.left =
    (
      40 +
      Math.random() *
      20
    ) + "%";

  element.style.top =
    (
      35 +
      Math.random() *
      25
    ) + "%";

  $("frogArea")
    .appendChild(
      element
    );

  setTimeout(
    () => element.remove(),
    800
  );

}

/* =========================================================
   MECHANICS BAR
========================================================= */

function renderMechanics() {

  const bar =
    $("mechanicsBar");

  bar.innerHTML = "";

  mechanics.forEach(
    (
      mechanic,
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.textContent =
        mechanic;

      if (
        index ===
        state.activeMechanic
      ) {

        button.classList.add(
          "active"
        );

      }

      button.addEventListener(
        "click",
        () => {

          state.activeMechanic =
            index;

          render();

        }
      );

      bar.appendChild(
        button
      );

    }
  );

}

/* =========================================================
   ITEM PANEL
========================================================= */

function renderItems() {

  const panel =
    $("items");

  panel.innerHTML = "";

  const start =
    state.activeMechanic *
    10;

  const end =
    start + 10;

  for (
    let i = start;
    i < end;
    i++
  ) {

    const item =
      items[i];

    if (!item) {
      continue;
    }

    const cost =
      item.baseCost *
      Math.pow(
        1.12,
        state.owned[i]
      );

    const box =
      document.createElement(
        "div"
      );

    box.className =
      "item";

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "item-name";

    name.textContent =
      item.name;

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "item-info";

    info.textContent =
      "Power +" +
      item.power +
      " • Owned " +
      state.owned[i] +
      " • Cost " +
      formatNumber(cost) +
      " 🌿";

    const buy =
      document.createElement(
        "button"
      );

    buy.textContent =
      "Buy";

    buy.style.width =
      "100%";

    buy.disabled =
      state.coins <
      cost;

    buy.addEventListener(
      "click",
      () => {

        buyItem(i);

      }
    );

    box.appendChild(
      name
    );

    box.appendChild(
      info
    );

    box.appendChild(
      buy
    );

    panel.appendChild(
      box
    );

  }

  $("mechanicTitle")
    .textContent =
    mechanics[
      state.activeMechanic
    ];

  $("mechanicDescription")
    .textContent =
    "Upgrade " +
    mechanics[
      state.activeMechanic
    ] +
    " using these 10 upgrades.";

}

/* =========================================================
   BUY
========================================================= */

function buyItem(index) {

  const item =
    items[index];

  const cost =
    item.baseCost *
    Math.pow(
      1.12,
      state.owned[index]
    );

  if (
    state.coins <
    cost
  ) {

    return;

  }

  state.coins -=
    cost;

  state.owned[index]++;

  addXP(
    item.power * 2
  );

  log(
    "🛒 Bought " +
    item.name
  );

  render();

}

/* =========================================================
   REBIRTH
========================================================= */

function rebirth() {

  const requirement =
    1000000 *
    Math.pow(
      3,
      state.rebirths
    );

  if (
    state.coins <
    requirement
  ) {

    toast(
      "Need " +
      formatNumber(
        requirement
      ) +
      " Lily."
    );

    return;

  }

  state.rebirths++;

  state.coins = 0;

  state.owned.fill(0);

  state.combo = 0;

  state.multiplier =
    1 +
    state.rebirths *
    0.2;

  state.energy =
    state.maxEnergy;

  toast(
    "♻️ Pond Rebirth!"
  );

  log(
    "♻️ Rebirth " +
    state.rebirths +
    " complete."
  );

  render();

}

/* =========================================================
   SAVE
========================================================= */

function saveGame(
  showMessage = true
) {

  const save = {

    version: 2,

    coins:
      state.coins,

    clicks:
      state.clicks,

    energy:
      state.energy,

    maxEnergy:
      state.maxEnergy,

    multiplier:
      state.multiplier,

    rebirths:
      state.rebirths,

    level:
      state.level,

    xp:
      state.xp,

    xpNeeded:
      state.xpNeeded,

    activeMechanic:
      state.activeMechanic,

    combo:
      state.combo,

    maxCombo:
      state.maxCombo,

    criticals:
      state.criticals,

    achievements:
      state.achievements,

    totalPlayTime:
      state.totalPlayTime,

    owned:
      state.owned,

    savedAt:
      Date.now()

  };

  try {

    localStorage.setItem(
      "frog-clicker-save",
      JSON.stringify(save)
    );

    state.lastSave =
      Date.now();

    if (showMessage) {

      toast(
        "💾 Game saved!"
      );

    }

  } catch (error) {

    log(
      "❌ Could not save game."
    );

  }

}

/* =========================================================
   LOAD
========================================================= */

function loadGame() {

  try {

    const raw =
      localStorage.getItem(
        "frog-clicker-save"
      );

    if (!raw) {
      return;
    }

    const save =
      JSON.parse(raw);

    if (
      !save ||
      !Array.isArray(
        save.owned
      ) ||
      save.owned.length !==
        mechanics.length * 10
    ) {

      return;

    }

    state.coins =
      Math.max(
        0,
        Number(save.coins) || 0
      );

    state.clicks =
      Math.max(
        0,
        Number(save.clicks) || 0
      );

    state.maxEnergy =
      Math.max(
        100,
        Number(
          save.maxEnergy
        ) || 100
      );

    state.energy =
      Math.max(
        0,
        Math.min(
          state.maxEnergy,
          Number(save.energy) ||
          0
        )
      );

    state.multiplier =
      Math.max(
        1,
        Number(
          save.multiplier
        ) || 1
      );

    state.rebirths =
      Math.max(
        0,
        Math.floor(
          Number(
            save.rebirths
          ) || 0
        )
      );

    state.level =
      Math.max(
        1,
        Math.floor(
          Number(
            save.level
          ) || 1
        )
      );

    state.xp =
      Math.max(
        0,
        Number(
          save.xp
        ) || 0
      );

    state.xpNeeded =
      Math.max(
        100,
        Number(
          save.xpNeeded
        ) || 100
      );

    state.activeMechanic =
      Math.max(
        0,
        Math.min(
          mechanics.length - 1,
          Math.floor(
            Number(
              save.activeMechanic
            ) || 0
          )
        )
      );

    state.combo =
      Math.max(
        0,
        Number(
          save.combo
        ) || 0
      );

    state.maxCombo =
      Math.max(
        0,
        Number(
          save.maxCombo
        ) || 0
      );

    state.criticals =
      Math.max(
        0,
        Number(
          save.criticals
        ) || 0
      );

    state.totalPlayTime =
      Math.max(
        0,
        Number(
          save.totalPlayTime
        ) || 0
      );

    state.owned =
      save.owned.map(
        value =>
          Math.max(
            0,
            Math.floor(
              Number(value) || 0
            )
          )
      );

    /* OFFLINE EARNINGS */

    if (
      Number.isFinite(
        save.savedAt
      )
    ) {

      const offlineSeconds =
        Math.min(
          60 * 60 * 12,
          Math.max(
            0,
            (Date.now() -
              save.savedAt) /
              1000
          )
        );

      const offlineIncome =
        getIncomePerSecond() *
        offlineSeconds *
        0.5;

      if (
        offlineIncome > 0
      ) {

        state.coins +=
          offlineIncome;

        log(
          "🌙 Offline earnings: +" +
          formatNumber(
            offlineIncome
          ) +
          " Lily"
        );

      }

    }

  } catch (error) {

    console.warn(
      "Save could not be loaded.",
      error
    );

  }

}

/* =========================================================
   RESET
========================================================= */

function resetGame() {

  if (
    !confirm(
      "Reset ALL Frog Clicker progress?"
    )
  ) {

    return;

  }

  try {

    localStorage.removeItem(
      "frog-clicker-save"
    );

  } catch (error) {}

  location.reload();

}

/* =========================================================
   STATS
========================================================= */

function updateStats() {

  const income =
    getIncomePerSecond();

  $("coins")
    .textContent =
    formatNumber(
      state.coins
    );

  $("income")
    .textContent =
    formatNumber(
      income
    );

  $("clicks")
    .textContent =
    formatNumber(
      state.clicks
    );

  $("level")
    .textContent =
    state.level;

  $("rebirths")
    .textContent =
    state.rebirths;

  $("energy")
    .textContent =
    Math.floor(
      state.energy
    ) +
    "/" +
    state.maxEnergy;

  const energyPercent =
    Math.max(
      0,
      Math.min(
        100,
        state.energy /
        state.maxEnergy *
        100
      )
    );

  $("energyFill")
    .style.width =
    energyPercent +
    "%";

  $("energyPercent")
    .textContent =
    Math.floor(
      energyPercent
    ) +
    "%";

  $("xpText")
    .textContent =
    formatNumber(
      state.xp
    ) +
    " / " +
    formatNumber(
      state.xpNeeded
    );

  $("xpFill")
    .style.width =
    Math.min(
      100,
      state.xp /
      state.xpNeeded *
      100
    ) +
    "%";

  $("achievementCount")
    .textContent =
    state.achievements;

}

/* =========================================================
   RENDER
========================================================= */

function render() {

  renderMechanics();

  renderItems();

  updateStats();

}

/* =========================================================
   BUTTONS
========================================================= */

$("frog")
  .addEventListener(
    "click",
    () => clickFrog()
  );

$("frog")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();

        clickFrog();

      }

    }
  );

$("megaClick")
  .addEventListener(
    "click",
    () => {

      clickFrog(25);

    }
  );

$("critButton")
  .addEventListener(
    "click",
    criticalCroak
  );

$("rebirthButton")
  .addEventListener(
    "click",
    rebirth
  );

$("saveButton")
  .addEventListener(
    "click",
    () => saveGame(true)
  );

$("resetButton")
  .addEventListener(
    "click",
    resetGame
  );

/* =========================================================
   COMBO TIMER
========================================================= */

setInterval(
  () => {

    if (
      state.combo > 0
    ) {

      state.combo =
        Math.max(
          0,
          state.combo - 1
        );

    }

  },
  1000
);

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
  performance.now();

function gameLoop(
  currentTime
) {

  const delta =
    Math.min(
      .25,
      Math.max(
        0,
        (currentTime -
          lastTime) /
          1000
      )
    );

  lastTime =
    currentTime;

  state.totalPlayTime +=
    delta;

  /* PASSIVE INCOME */

  state.coins +=
    getIncomePerSecond() *
    delta;

  /* ENERGY */

  state.energy =
    Math.min(
      state.maxEnergy,
      state.energy +
      delta * 4
    );

  updateStats();

  requestAnimationFrame(
    gameLoop
  );

}

requestAnimationFrame(
  gameLoop
);

/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(
  () => saveGame(false),
  10000
);

/* =========================================================
   BUG TESTS
========================================================= */

function runSelfTests() {

  const tests = [

    [
      "Exactly 330 mechanics",
      mechanics.length === 330
    ],

    [
      "Exactly 3300 items",
      items.length === 3300
    ],

    [
      "10 items per mechanic",
      items.length ===
      mechanics.length * 10
    ],

    [
      "Owned array matches items",
      state.owned.length ===
      items.length
    ],

    [
      "All item costs finite",
      items.every(
        item =>
          Number.isFinite(
            item.baseCost
          ) &&
          item.baseCost > 0
      )
    ],

    [
      "All item powers valid",
      items.every(
        item =>
          Number.isFinite(
            item.power
          ) &&
          item.power > 0
      )
    ],

    [
      "Mechanics bar exists",
      !!$("mechanicsBar")
    ],

    [
      "Frog exists",
      !!$("frog")
    ],

    [
      "Items panel exists",
      !!$("items")
    ],

    [
      "Energy system exists",
      !!$("energyFill")
    ],

    [
      "Save button exists",
      !!$("saveButton")
    ],

    [
      "Reset button exists",
      !!$("resetButton")
    ]

  ];

  let passed = 0;

  for (
    const test of tests
  ) {

    if (
      test[1]
    ) {

      passed++;

    } else {

      console.error(
        "BUG FOUND:",
        test[0]
      );

      log(
        "🐛 BUG: " +
        test[0]
      );

    }

  }

  if (
    passed ===
    tests.length
  ) {

    log(
      "✅ Self-test: " +
      passed +
      "/" +
      tests.length +
      " tests passed."
    );

  }

}

/* =========================================================
   START
========================================================= */

loadGame();

render();

runSelfTests();

log(
  "🐸 Welcome to Frog Clicker!"
);

log(
  "🧪 330 mechanics and 3300 upgrades loaded."
);

</script>
