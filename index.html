<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frog Clicker: 300 Mechanics</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#72d7ff,#b8f58a);font-family:system-ui;color:#16351d;text-align:center}
#game{max-width:1100px;margin:auto;padding:15px}
h1{margin:5px;font-size:clamp(28px,5vw,52px)}
.panel{background:#ffffffdd;border:3px solid #287a39;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 5px 15px #0002}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:#e8ffe4;border-radius:12px;padding:8px;font-weight:bold}
#frog{font-size:150px;cursor:pointer;user-select:none;display:inline-block;transition:.08s;filter:drop-shadow(0 10px 5px #0003)}
#frog:active{transform:scale(.9) rotate(-4deg)}
button{border:0;border-radius:10px;padding:9px 12px;margin:4px;background:#3baa50;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.shop{background:#f5fff1;padding:10px;border-radius:12px;text-align:left}
.small{font-size:12px;color:#41604a}
#log{height:90px;overflow:auto;text-align:left;font-size:13px;background:#102d18;color:#caffc6;padding:8px;border-radius:10px}
.skin{font-size:45px}
.selected{outline:4px solid #ffd52e}
.progress{height:14px;background:#d5e7d3;border-radius:9px;overflow:hidden}
.progress>div{height:100%;background:#38ad4c;width:0%}
.badge{display:inline-block;background:#ffd95a;padding:4px 7px;border-radius:8px;margin:3px;font-size:12px}
#achievements{max-height:180px;overflow:auto}
</style>
</head>
<body>
<div id="game">
<h1>🐸 Frog Clicker</h1>

<div class="panel stats">
<div class="stat">🍃 Lilypad Coins<br><span id="coins">0</span></div>
<div class="stat">👆 Click Power<br><span id="power">1</span></div>
<div class="stat">🦗 Frogs/sec<br><span id="fps">0</span></div>
<div class="stat">🏆 Level<br><span id="level">1</span></div>
<div class="stat">🔥 Combo<br><span id="combo">0</span></div>
<div class="stat">👅 Total Clicks<br><span id="clicks">0</span></div>
</div>

<div class="panel">
<div id="frog">🐸</div>
<div class="progress"><div id="xpbar"></div></div>
<p>XP: <span id="xp">0</span> / <span id="nextxp">100</span></p>
<button onclick="saveGame()">💾 Save</button>
<button onclick="loadGame()">📂 Load</button>
<button onclick="resetGame()">🗑️ Reset</button>
</div>

<div class="panel">
<h2>🎨 Frog Skins</h2>
<div id="skins" class="grid"></div>
</div>

<div class="panel">
<h2>🛒 Upgrades</h2>
<div id="shop" class="grid"></div>
</div>

<div class="panel">
<h2>🏅 Achievements</h2>
<div id="achievements"></div>
</div>

<div class="panel">
<h2>📜 Frog Journal</h2>
<div id="log"></div>
</div>
</div>

<script>
"use strict";

/* =========================================================
   FROG CLICKER
   Single-file GitHub Pages game
   300 gameplay mechanics
   No energy system
   ========================================================= */

const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmt=n=>Math.floor(n).toLocaleString();

let G={
 coins:0,power:1,fps:0,level:1,xp:0,clicks:0,totalCoins:0,
 combo:0,maxCombo:0,crit:0,luck:0,mult:1,rebirths:0,
 jumps:0,flies:0,pond:0,weather:0,season:0,
 last:Date.now(),selectedSkin:0,ach:[],
 upgrades:{}
};

/* ---------- 30 upgrade families x 10 levels = 300 mechanics ---------- */

const mechanicNames=[
"Sticky Tongue","Strong Legs","Big Eyes","Golden Belly","Fast Blinks",
"Loud Croak","Long Leap","Fly Radar","Rain Dance","Lily Training",
"Moonlight","Sunlight","Pond Luck","Dragonfly Charm","Mosquito Net",
"Bubble Shield","Moss Armor","Crystal Tongue","Royal Crown","Swamp Boots",
"Jungle Instinct","Tree Climber","Water Sprint","Mud Power","Lotus Blessing",
"Firefly Friend","Frog Choir","Rain Collector","Meteor Lily","Ancient Croak"
];

const mechanicDescriptions=[
"Increase click power","Increase passive income","Increase critical chance",
"Increase coin multiplier","Improve combo gain","Increase passive income",
"Increase click power","Increase fly rewards","Increase weather bonus",
"Increase XP gain","Increase night bonus","Increase daytime bonus",
"Increase random rewards","Increase critical rewards","Increase luck",
"Reduce negative events","Increase defense rewards","Increase critical chance",
"Increase all income","Increase passive income","Increase rare rewards",
"Increase jump rewards","Increase passive income","Increase click power",
"Increase XP","Increase click combo","Increase passive income",
"Increase weather rewards","Increase all multipliers","Increase level rewards"
];

const upgrades=[];
for(let family=0;family<30;family++){
  for(let lv=1;lv<=10;lv++){
    let id=family*10+lv;
    upgrades.push({
      id,
      family,
      level:lv,
      name:mechanicNames[family]+" "+lv,
      desc:mechanicDescriptions[family],
      cost:Math.floor(15*Math.pow(1.55,id)),
    });
  }
}

/* ---------- SKINS ---------- */
/* Poison dart frog is deliberately the final skin. */
const skins=[
["🐸","Classic Frog",0],
["🐸","Green Frog",50],
["🐸","Tree Frog",250],
["🐸","Golden Frog",1000],
["🐸","Blue Frog",5000],
["🐸","Red-Eyed Frog",20000],
["🐸","Marsh Frog",75000],
["🐸","Glass Frog",250000],
["🐸","Rainbow Frog",1000000],
["🐸","Galaxy Frog",5000000],
["🐸","Royal Frog",25000000],
["🐸","Ancient Frog",100000000],
["🐸","Cosmic Frog",500000000],
["🐸","Legendary Frog",2500000000],
["🐸","☠️ Poison Dart Frog",10000000000]
];

function skinColor(i){
 const colors=[
 "#53b848","#58c94d","#45b7d8","#ffd83d","#38a8ff",
 "#ef4444","#739b43","#b7e7d9","#ff62d7","#693cff",
 "#f0c83e","#7b5cff","#22d3ee","#ff8b35","#146b39"
 ];
 return colors[i]||"#53b848";
}

function renderSkins(){
 $("skins").innerHTML=skins.map((s,i)=>{
  const owned=G.totalCoins>=s[2];
  return `<div class="shop ${G.selectedSkin===i?"selected":""}">
    <div class="skin" style="filter:drop-shadow(0 3px 3px ${skinColor(i)})">${s[0]}</div>
    <b>${s[1]}</b><br>
    <span class="small">${i===14?"FINAL SKIN • POISON DART FROG":owned?"Unlocked":"Unlock at "+fmt(s[2])+" coins"}</span><br>
    <button ${owned?"":"disabled"} onclick="selectSkin(${i})">
      ${G.selectedSkin===i?"Equipped":"Equip"}
    </button>
  </div>`;
 }).join("");
}

function selectSkin(i){
 if(G.totalCoins<skins[i][2])return;
 G.selectedSkin=i;
 $("frog").style.color=skinColor(i);
 log("Equipped "+skins[i][1]+"!");
 renderSkins();
 saveGame();
}

/* ---------- 300 MECHANICS ---------- */

function upgradeEffect(u){
 const f=u.family,l=u.level;
 const n=f*10+l;

 switch(f){
  case 0:return 1+l*.35;
  case 1:return l*.5;
  case 2:return l*.01;
  case 3:return 1+l*.025;
  case 4:return 1+l*.08;
  case 5:return l*.25;
  case 6:return 1+l*.4;
  case 7:return l*.15;
  case 8:return l*.1;
  case 9:return 1+l*.05;
  case 10:return 1+l*.04;
  case 11:return 1+l*.04;
  case 12:return l*.02;
  case 13:return 1+l*.12;
  case 14:return l*.02;
  case 15:return l*.05;
  case 16:return l*.03;
  case 17:return l*.015;
  case 18:return 1+l*.04;
  case 19:return l*.4;
  case 20:return l*.025;
  case 21:return l*.3;
  case 22:return l*.35;
  case 23:return 1+l*.3;
  case 24:return 1+l*.07;
  case 25:return l*.1;
  case 26:return l*.3;
  case 27:return l*.15;
  case 28:return 1+l*.08;
  case 29:return 1+l*.1;
 }
 return 1;
}

function levelOfFamily(f){
 return G.upgrades[f]||0;
}

function calcStats(){
 let p=1,pass=0,crit=.05,mult=1,xp=1,luck=0;

 for(let f=0;f<30;f++){
   let l=levelOfFamily(f);
   if(!l)continue;
   let e=upgradeEffect({family:f,level:l});
   if(f===0||f===6||f===23)p*=e;
   if(f===1||f===5||f===19||f===21||f===22||f===25||f===26)pass+=e;
   if(f===2||f===17)crit+=e;
   if(f===3||f===18||f===28||f===29)mult*=e;
   if(f===9||f===24)xp*=e;
   if(f===12||f===14||f===20)luck+=e;
   if(f===4)G.combo=Math.min(G.combo,999999);
 }
 return {p,pass,crit:clamp(crit,0,.95),mult,xp,luck};
}

function renderShop(){
 const visible=upgrades.slice(0,Math.min(upgrades.length,20+G.level*5));
 $("shop").innerHTML=visible.map(u=>{
   const owned=levelOfFamily(u.family)>=u.level;
   const next=levelOfFamily(u.family)+1===u.level;
   return `<div class="shop">
    <b>${u.id+1}. ${u.name}</b><br>
    <span class="small">${u.desc}</span><br>
    ${owned
      ?`<span class="badge">OWNED</span>`
      :`<span>🍃 ${fmt(u.cost)}</span>
        <button ${next&&G.coins>=u.cost?"":"disabled"} onclick="buyUpgrade(${u.id})">
        Buy</button>`}
   </div>`;
 }).join("");
}

function buyUpgrade(id){
 const u=upgrades[id];
 if(!u)return;
 if(levelOfFamily(u.family)!==u.level-1)return;
 if(G.coins<u.cost)return;
 G.coins-=u.cost;
 G.upgrades[u.family]=u.level;
 log("Unlocked mechanic #"+(id+1)+": "+u.name);
 renderShop();
 update();
 saveGame();
}

/* ---------- CLICKING ---------- */

function clickFrog(){
 const s=calcStats();

 let amount=s.p*G.mult;

 G.combo++;
 G.maxCombo=Math.max(G.maxCombo,G.combo);

 let comboMult=1+Math.min(G.combo,100)*.01;
 let critical=Math.random()<s.crit;

 if(critical){
   amount*=3+s.luck*.1;
   G.crit++;
   log("💥 CRITICAL TONGUE HIT!");
 }

 amount*=comboMult;

 /* Random frog events */
 const roll=Math.random();
 if(roll<.01+s.luck*.001){
   let bonus=Math.max(10,amount*10);
   G.coins+=bonus;
   G.totalCoins+=bonus;
   log("🍀 Lucky frog found "+fmt(bonus)+" coins!");
 }

 if(roll>.995){
   amount*=10;
   log("🌈 RARE FROG BURST x10!");
 }

 G.coins+=amount;
 G.totalCoins+=amount;
 G.clicks++;
 G.xp+=s.xp;

 if(Math.random()<.08)G.jumps++;
 if(Math.random()<.05)G.flies++;

 levelCheck();
 update();

 $("frog").animate(
   [{transform:"scale(1)"},{transform:"scale(1.15) rotate(3deg)"},{transform:"scale(1)"}],
   {duration:120}
 );
}

/* ---------- PASSIVE SYSTEM ---------- */

function tick(){
 const now=Date.now();
 const dt=Math.min((now-G.last)/1000,3);
 G.last=now;

 const s=calcStats();

 let gain=s.pass*G.mult*dt;

 /* Weather mechanic */
 if(G.weather===1)gain*=2;
 if(G.weather===2)gain*=.75;
 if(G.weather===3)gain*=3;

 /* Season mechanic */
 if(G.season===1)gain*=1.25;
 if(G.season===2)gain*=1.5;
 if(G.season===3)gain*=1.75;

 /* Combo passive */
 gain*=1+Math.min(G.combo,100)*.005;

 G.coins+=gain;
 G.totalCoins+=gain;
 G.fps=s.pass;

 /* Combo slowly cools, but there is NO energy mechanic. */
 if(G.combo>0)G.combo=Math.max(0,G.combo-dt*.7);

 /* Random events */
 if(Math.random()<dt*.006){
   const events=[
    ["🪰 A swarm landed on your pond!",5],
    ["🌧️ Rain filled the lily pond!",10],
    ["🦋 A butterfly blessed the frog!",15],
    ["🍄 You found a magical mushroom!",25],
    ["⭐ A shooting star passed overhead!",50]
   ];
   const e=events[Math.floor(Math.random()*events.length)];
   const bonus=Math.max(10,gain*e[1]);
   G.coins+=bonus;
   G.totalCoins+=bonus;
   log(e[0]+" +"+fmt(bonus));
 }

 levelCheck();
 update();
}

/* ---------- LEVELS ---------- */

function levelCheck(){
 const need=100*Math.pow(1.18,G.level-1);

 while(G.xp>=needForLevel()){
   G.xp-=needForLevel();
   G.level++;
   const reward=G.level*100;
   G.coins+=reward;
   G.totalCoins+=reward;
   log("🎉 Level "+G.level+"! +"+fmt(reward)+" coins");
 }
}

function needForLevel(){
 return Math.floor(100*Math.pow(1.18,G.level-1));
}

/* ---------- ACHIEVEMENTS ---------- */

const achievementList=[
 ["First Hop",()=>G.clicks>=1],
 ["Tongue Beginner",()=>G.clicks>=100],
 ["Tongue Master",()=>G.clicks>=1000],
 ["Tongue Legend",()=>G.clicks>=10000],
 ["Million Frog",()=>G.totalCoins>=1000000],
 ["Billion Frog",()=>G.totalCoins>=1000000000],
 ["Combo 10",()=>G.maxCombo>=10],
 ["Combo 50",()=>G.maxCombo>=50],
 ["Combo 100",()=>G.maxCombo>=100],
 ["Critical Frog",()=>G.crit>=10],
 ["Critical Legend",()=>G.crit>=100],
 ["Rain Dancer",()=>G.weather>0],
 ["Jump Champion",()=>G.jumps>=100],
 ["Fly Hunter",()=>G.flies>=100],
 ["Upgrade Hunter",()=>Object.values(G.upgrades).reduce((a,b)=>a+b,0)>=10],
 ["Upgrade Master",()=>Object.values(G.upgrades).reduce((a,b)=>a+b,0)>=50],
 ["Mechanic Collector",()=>Object.values(G.upgrades).reduce((a,b)=>a+b,0)>=100],
 ["Mechanic Master",()=>Object.values(G.upgrades).reduce((a,b)=>a+b,0)>=200],
 ["All Mechanics",()=>Object.values(G.upgrades).reduce((a,b)=>a+b,0)>=300],
 ["Poison Dart",()=>G.selectedSkin===14]
];

function checkAchievements(){
 achievementList.forEach((a,i)=>{
  if(a[1]()&&!G.ach.includes(i)){
   G.ach.push(i);
   G.coins+=1000;
   G.totalCoins+=1000;
   log("🏆 Achievement: "+a[0]+" (+1,000)");
  }
 });
 $("achievements").innerHTML=achievementList.map((a,i)=>
  `<span class="badge" style="opacity:${G.ach.includes(i)?1:.35}">
  ${G.ach.includes(i)?"🏆":"🔒"} ${a[0]}</span>`
 ).join("");
}

/* ---------- WEATHER / SEASONS ---------- */

function changeWorld(){
 G.weather=Math.floor(Math.random()*4);
 G.season=Math.floor(Math.random()*4);

 const weather=["☀️ Sunny","🌧️ Rainy","🌩️ Stormy","🌈 Rainbow"];
 const season=["🌱 Spring","☀️ Summer","🍂 Autumn","❄️ Winter"];

 log(weather[G.weather]+" weather • "+season[G.season]);

 setTimeout(changeWorld,60000);
}

/* ---------- SAVE / LOAD ---------- */

function saveGame(){
 localStorage.setItem("frogClicker300",JSON.stringify(G));
 log("💾 Game saved.");
}

function loadGame(){
 try{
  const x=JSON.parse(localStorage.getItem("frogClicker300"));
  if(x){
   G={...G,...x};
   G.upgrades={...x.upgrades};
   G.ach=x.ach||[];
   G.last=Date.now();
   log("📂 Game loaded.");
   renderAll();
  }
 }catch(e){
  console.error(e);
  log("⚠️ Save data was invalid.");
 }
}

function resetGame(){
 if(!confirm("Reset all frog progress?"))return;
 localStorage.removeItem("frogClicker300");
 location.reload();
}

/* ---------- UI ---------- */

function update(){
 const s=calcStats();

 $("coins").textContent=fmt(G.coins);
 $("power").textContent=fmt(s.p*G.mult);
 $("fps").textContent=s.pass.toFixed(1);
 $("level").textContent=G.level;
 $("combo").textContent=Math.floor(G.combo);
 $("clicks").textContent=fmt(G.clicks);
 $("xp").textContent=fmt(G.xp);
 $("nextxp").textContent=fmt(needForLevel());
 $("xpbar").style.width=clamp(G.xp/needForLevel()*100,0,100)+"%";

 if(Math.floor(Date.now()/1000)%3===0){
   renderShop();
   renderSkins();
   checkAchievements();
 }
}

function renderAll(){
 renderSkins();
 renderShop();
 checkAchievements();
 update();
}

function log(msg){
 const el=$("log");
 const time=new Date().toLocaleTimeString();
 el.innerHTML=`<div>[${time}] ${msg}</div>`+el.innerHTML;
 while(el.children.length>80)el.removeChild(el.lastChild);
}

/* ---------- INPUT ---------- */

$("frog").addEventListener("click",clickFrog);

document.addEventListener("keydown",e=>{
 if(e.code==="Space"){
   e.preventDefault();
   clickFrog();
 }
 if(e.key.toLowerCase()==="s")saveGame();
});

/* ---------- BUG SELF-CHECK ---------- */

function selfTest(){
 const tests=[
  ["Game object exists",!!G],
  ["300 mechanics generated",upgrades.length===300],
  ["30 mechanic families",mechanicNames.length===30],
  ["10 levels each",upgrades.every((x,i)=>x.level===i%10+1)],
  ["Final skin is Poison Dart Frog",skins[14][1].includes("Poison Dart Frog")],
  ["No energy property",!("energy" in G)],
  ["Costs are positive",upgrades.every(x=>x.cost>0)],
  ["Upgrade IDs unique",new Set(upgrades.map(x=>x.id)).size===300],
  ["All upgrades have descriptions",upgrades.every(x=>x.desc)],
  ["Save system available",typeof saveGame==="function"],
  ["Click system available",typeof clickFrog==="function"],
  ["Passive system available",typeof tick==="function"]
 ];

 const failed=tests.filter(x=>!x[1]);

 if(failed.length){
   console.error("SELF TEST FAILED:",failed);
   log("⚠️ Self-test found "+failed.length+" issue(s).");
 }else{
   console.log("FROG CLICKER SELF-TEST PASSED:",tests.length,"tests");
   log("✅ Bug self-test passed: "+tests.length+" checks.");
 }
}

/* ---------- START ---------- */

renderAll();
selfTest();
changeWorld();

setInterval(tick,100);
setInterval(update,500);
setInterval(saveGame,30000);

window.addEventListener("beforeunload",saveGame);
</script>
</body>
</html>
