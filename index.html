<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frog Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h1>🐸 Frog Clicker</h1>

      <nav id="nav">
        <button data-page="home" class="active">🏠 Home</button>
        <button data-page="upgrades">⬆️ Upgrades</button>
        <button data-page="skins">🐸 Frog Skins</button>
        <button data-page="quests">📜 Quests</button>
        <button data-page="achievements">🏆 Achievements</button>
        <button data-page="pond">🌿 Pond</button>
        <button data-page="research">🔬 Research</button>
        <button data-page="inventory">🎒 Inventory</button>
        <button data-page="stats">📊 Stats</button>
        <button data-page="settings">⚙️ Settings</button>
      </nav>

      <div class="save-buttons">
        <button id="saveBtn">💾 Save</button>
        <button id="resetBtn" class="danger">🗑️ Reset</button>
      </div>

      <div class="no-energy">
        ♾️ <strong>No Energy</strong>
        <small>Click forever!</small>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Frog Clicker</h2>
          <p id="pageSubtitle">Build the ultimate frog kingdom.</p>
        </div>

        <div class="resources">
          <div>🍃 <span id="leaves">0</span></div>
          <div>💧 <span id="dew">0</span></div>
          <div>⭐ <span id="stars">0</span></div>
          <div>🐸 Lv.<span id="level">1</span></div>
        </div>
      </header>

      <section id="content"></section>
    </main>

    <aside class="rightbar">
      <h2>🐸 Current Frog</h2>

      <div id="frogPreview" class="frog-preview">
        <div class="frog-body"></div>
        <div class="frog-eye left"><span></span></div>
        <div class="frog-eye right"><span></span></div>
        <div class="frog-mouth"></div>
      </div>

      <h3 id="skinName">Classic Frog</h3>

      <div class="stat-box">
        <span>Clicks</span>
        <strong id="clicks">0</strong>
      </div>

      <div class="stat-box">
        <span>Combo</span>
        <strong id="combo">x1</strong>
      </div>

      <div class="stat-box">
        <span>XP</span>
        <strong><span id="xp">0</span> / <span id="xpNeeded">25</span></strong>
      </div>

      <div class="xp-bar">
        <div id="xpFill"></div>
      </div>

      <div id="activity" class="activity"></div>
    </aside>
  </div>

  <div id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
