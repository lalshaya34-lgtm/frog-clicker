<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07150c">
<title>🐸 Ultimate Frog Clicker</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#061009;
  --bg2:#0a1b10;
  --panel:#0d2416;
  --panel2:#102d1b;
  --border:#2d7045;
  --green:#6df09b;
  --green2:#2dbb63;
  --gold:#ffd65a;
  --blue:#6bbcff;
  --purple:#bd8cff;
  --red:#ff7373;
  --text:#effff4;
  --muted:#9dbca7;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#1c5732 0,#07130b 42%,#030806 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font:inherit;
}

button:not(:disabled){
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.38;
}

.app{
  width:min(1550px,100%);
  margin:auto;
  padding:8px;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,16,9,.96);
  border:1px solid var(--border);
  border-radius:15px;
  padding:8px;
  backdrop-filter:blur(15px);
  box-shadow:0 10px 35px #0008;
}

.category-tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:thin;
  padding-bottom:6px;
}

.category-tabs button,
.mechanic-tabs button{
  flex:0 0 auto;
  color:var(--text);
  background:#0a1d11;
  border:1px solid #285e3d;
  border-radius:8px;
  padding:7px 9px;
  font-size:11px;
  font-weight:800;
}

.category-tabs button.active,
.mechanic-tabs button.active{
  background:#25633b;
  border-color:var(--green);
  color:white;
}

.mechanic-tabs{
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding:3px 0 7px;
}

.mechanic-tabs button{
  font-size:10px;
  padding:6px 8px;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.stat{
  border:1px solid #275d3b;
  background:#091b10;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
}

.stat strong{
  color:var(--green);
}

.top-button{
  border:1px solid #39794f;
  background:#12351f;
  color:white;
  border-radius:8px;
  padding:7px 10px;
  font-weight:800;
}

/* MAIN */

.main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 470px;
  gap:12px;
  margin-top:12px;
}

.card{
  background:rgba(9,29,17,.96);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  box-shadow:0 8px 25px #0004;
}

/* FROG */

.frog-card{
  min-height:480px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,#2a7545 0,#153d25 35%,#07130b 76%);
}

.frog-card::before{
  content:"🪷   🌿   🪷   🌿   🪷";
  position:absolute;
  bottom:25px;
  font-size:35px;
  opacity:.8;
  white-space:nowrap;
}

.frog{
  position:relative;
  z-index:2;
  font-size:165px;
  line-height:1;
  user-select:none;
  cursor:pointer;
  filter:drop-shadow(0 20px 15px #0008);
  transition:transform .06s;
}

.frog:hover{
  transform:scale(1.04);
}

.frog:active{
  transform:scale(.88) rotate(-4deg);
}

/* BARS */

.bar-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:12px;
}

.bar{
  width:100%;
  height:13px;
  background:#020603;
  border-radius:100px;
  overflow:hidden;
  border:1px solid #183b25;
}

.fill{
  height:100%;
  width:0%;
  transition:width .15s;
}

.energy-fill{
  background:linear-gradient(90deg,#25b85e,#b9f271);
}

.xp-fill{
  background:linear-gradient(90deg,#755cff,#d49aff);
}

.boss-fill{
  background:linear-gradient(90deg,#d94c4c,#ffb15e);
}

/* BUTTONS */

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.action{
  border:1px solid #34774c;
  border-radius:9px;
  background:#12351f;
  color:white;
  padding:9px 12px;
  font-weight:800;
}

.action:hover{
  background:#1d5130;
}

.action.gold{
  border-color:#92752a;
  background:#403414;
}

.action.red{
  border-color:#873d3d;
  background:#3b1717;
}

/* UPGRADE PANEL */

.panel-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.panel-heading h2{
  margin:0;
  color:var(--green);
  font-size:20px;
}

.panel-description{
  color:var(--muted);
  font-size:12px;
  margin:6px 0 12px;
}

.upgrades{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  max-height:640px;
  overflow-y:auto;
  padding-right:3px;
}

.upgrade{
  border:1px solid #245d39;
  border-radius:10px;
  background:#081a0f;
  padding:9px;
}

.upgrade:hover{
  border-color:#4d9c68;
}

.upgrade-name{
  color:#80eea4;
  font-weight:900;
  font-size:12px;
}

.upgrade-description{
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
  min-height:30px;
  margin:4px 0;
}

.upgrade-meta{
  color:#c4dfcb;
  font-size:10px;
  margin-bottom:6px;
}

.buy{
  width:100%;
  border:1px solid #32744b;
  background:#123820;
  color:white;
  border-radius:7px;
  padding:7px;
  font-size:11px;
  font-weight:900;
}

.buy:hover:not(:disabled){
  background:#205b34;
}

/* LOG */

.log{
  max-height:170px;
  overflow:auto;
  font-size:11px;
  color:var(--muted);
}

.log div{
  padding:4px 0;
  border-bottom:1px solid #ffffff09;
}

/* FLOATING NUMBERS */

.float{
  position:absolute;
  z-index:30;
  pointer-events:none;
  color:var(--gold);
  font-size:21px;
  font-weight:1000;
  text-shadow:0 2px 5px #000;
  animation:floatUp .8s ease-out forwards;
}

@keyframes floatUp{
  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  to{
    opacity:0;
    transform:translateY(-100px) scale(1.2);
  }
}

/* TOAST */

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:99999;
  max-width:330px;
  padding:11px 15px;
  background:#143b24;
  border:1px solid var(--green);
  border-radius:10px;
  box-shadow:0 10px 35px #0009;
  font-size:13px;
  font-weight:800;
}

/* RESPONSIVE */

@media(max-width:1000px){
  .main{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .frog{
    font-size:115px;
  }

  .frog-card{
    min-height:350px;
  }

  .upgrades{
    grid-template-columns:1fr;
    max-height:600px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

  <div
    class="category-tabs"
    id="categoryTabs">
  </div>

  <div
    class="mechanic-tabs"
    id="mechanicTabs">
  </div>

  <div class="stats">

    <div class="stat">
      🌿 <strong id="coins">0</strong>
    </div>

    <div class="stat">
      💰/sec <strong id="income">0</strong>
    </div>

    <div class="stat">
      🖱️ <strong id="clicks">0</strong>
    </div>

    <div class="stat">
      ⭐ Lv <strong id="level">1</strong>
    </div>

    <div class="stat">
      ⚡ <strong id="energy">100/100</strong>
    </div>

    <div class="stat">
      🔥 Combo <strong id="combo">0</strong>
    </div>

    <div class="stat">
      ♻️ <strong id="rebirths">0</strong>
    </div>

    <button
      class="top-button"
      id="saveButton">
      💾 Save
    </button>

    <button
      class="top-button"
      id="resetButton">
      🔄 Reset
    </button>

  </div>

</header>

<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

<section>

  <div
    class="card frog-card"
    id="frogArea">

    <div
      class="frog"
      id="frog"
      tabindex="0"
      role="button"
      aria-label="Click frog">
      🐸
    </div>

  </div>

  <div
    class="card"
    style="margin-top:12px">

    <div class="bar-title">
      <b>⚡ Frog Energy</b>
      <span id="energyText">100%</span>
    </div>

    <div class="bar">
      <div
        class="fill energy-fill"
        id="energyFill">
      </div>
    </div>

    <div class="action-row">

      <button
        class="action"
        id="megaButton">
        🐸 Mega Croak ×25
      </button>

      <button
        class="action gold"
        id="criticalButton">
        💥 Critical Croak
      </button>

      <button
        class="action red"
        id="rebirthButton">
        ♻️ Rebirth
      </button>

    </div>

  </div>

  <div
    class="card"
    style="margin-top:12px">

    <div class="bar-title">
      <b>⭐ Frog XP</b>
      <span id="xpText">0 / 100</span>
    </div>

    <div class="bar">
      <div
        class="fill xp-fill"
        id="xpFill">
      </div>
    </div>

  </div>

  <div
    class="card"
    style="margin-top:12px">

    <div class="bar-title">
      <b>👹 Pond Boss</b>
      <span id="bossText">Ready</span>
    </div>

    <div class="bar">
      <div
        class="fill boss-fill"
        id="bossFill">
      </div>
    </div>

    <div class="action-row">

      <button
        class="action red"
        id="bossButton">
        ⚔️ Attack Boss
      </button>

    </div>

  </div>

  <div
    class="card"
    style="margin-top:12px">

    <b>📜 Frog Activity</b>

    <div
      class="log"
      id="log">
    </div>

  </div>

</section>

<!-- =====================================================
     UPGRADE PANEL
===================================================== -->

<aside class="card">

  <div class="panel-heading">

    <h2 id="mechanicTitle">
      Click Power
    </h2>

    <span id="upgradeCount">
      30
    </span>

  </div>

  <p
    class="panel-description"
    id="mechanicDescription">
  </p>

  <div
    class="upgrades"
    id="upgrades">
  </div>

</aside>

</main>

</div>

<script>
"use strict";

/* =========================================================
   30 CATEGORIES
========================================================= */

const categories = [
  "Clicking",
  "Energy",
  "Automation",
  "Lily Pads",
  "Mutations",
  "Magic",
  "Breeding",
  "Achievements",
  "Biomes",
  "Enemies",
  "Quests",
  "Minigames",
  "Artifacts",
  "Potions",
  "Weather",
  "Day Night",
  "Prestige",
  "Skins",
  "Events",
  "Companions",
  "Predators",
  "Treasures",
  "Jumping",
  "Swimming",
  "Croaks",
  "Decorations",
  "Mastery",
  "Research",
  "Exploration",
  "Village"
];

/* =========================================================
   20 MECHANICS PER CATEGORY
   30 × 20 = 600 MECHANICS
========================================================= */

const mechanicWords = [
  "Power",
  "Speed",
  "Capacity",
  "Efficiency",
  "Criticals",
  "Combos",
  "Mastery",
  "Training",
  "Levels",
  "Experience",
  "Rewards",
  "Bonuses",
  "Research",
  "Evolution",
  "Automation",
  "Rare Finds",
  "Lucky Chance",
  "Multiplier",
  "Challenges",
  "Ultimate"
];

const mechanics = [];

for(let c=0;c<categories.length;c++){
  for(let m=0;m<mechanicWords.length;m++){
    mechanics.push(
      categories[c]+" "+mechanicWords[m]
    );
  }
}

/* =========================================================
   30 UPGRADES PER CATEGORY
   30 × 30 = 900 UPGRADES
========================================================= */

const upgradeAdjectives = [
  "Tiny",
  "Mossy",
  "Swift",
  "Golden",
  "Royal",
  "Crystal",
  "Ancient",
  "Lucky",
  "Bubble",
  "Storm",
  "Sunny",
  "Shadow",
  "Emerald",
  "Cosmic",
  "Neon",
  "Marsh",
  "River",
  "Jungle",
  "Frost",
  "Rain",
  "Solar",
  "Turbo",
  "Mystic",
  "Wild",
  "Giant",
  "Pocket",
  "Legendary",
  "Mythic",
  "Ultimate",
  "Infinite"
];

const upgrades = [];

for(let c=0;c<categories.length;c++){

  for(let u=0;u<30;u++){

    upgrades.push({
      id:upgrades.length,
      category:c,
      level:u+1,
      name:
        upgradeAdjectives[u]+" "+
        categories[c]+" "+
        (u+1),

      power:
        1+(u+1)*1.5,

      baseCost:
        Math.floor(
          25*
          Math.pow(1.065,c*30+u)
        )
    });
  }
}

/* =========================================================
   GAME STATE
========================================================= */

const state = {
  coins:0,
  clicks:0,

  energy:100,
  maxEnergy:100,

  level:1,
  xp:0,
  xpNeeded:100,

  multiplier:1,

  combo:0,
  bestCombo:0,

  rebirths:0,
  criticals:0,

  activeCategory:0,
  activeMechanic:0,

  owned:Array(upgrades.length).fill(0),

  bossHP:1000,
  bossMaxHP:1000,
  bossesDefeated:0,

  totalPlayTime:0
};

/* =========================================================
   DOM HELPER
========================================================= */

function $(id){
  return document.getElementById(id);
}

/* =========================================================
   NUMBER FORMATTER
========================================================= */

function formatNumber(value){

  if(!Number.isFinite(value)){
    return "0";
  }

  const units=[
    ["Qi",1e18],
    ["Qa",1e15],
    ["T",1e12],
    ["B",1e9],
    ["M",1e6],
    ["K",1e3]
  ];

  for(const [name,size] of units){

    if(Math.abs(value)>=size){

      return (
        value/size
      ).toFixed(2)+name;
    }
  }

  return Math.floor(value).toString();
}

/* =========================================================
   LOG
========================================================= */

function addLog(message){

  const line=
    document.createElement("div");

  line.textContent=message;

  $("log").prepend(line);

  while(
    $("log").children.length>50
  ){
    $("log").lastChild.remove();
  }
}

/* =========================================================
   TOAST
========================================================= */

function toast(message){

  document
    .querySelectorAll(".toast")
    .forEach(x=>x.remove());

  const element=
    document.createElement("div");

  element.className="toast";
  element.textContent=message;

  document.body.appendChild(element);

  setTimeout(
    ()=>element.remove(),
    2200
  );
}

/* =========================================================
   INCOME
========================================================= */

function getIncomePerSecond(){

  let total=0;

  /*
    Only iterate over owned upgrades.
    This remains fast even with 900 upgrades.
  */

  for(let i=0;i<upgrades.length;i++){

    const amount=state.owned[i];

    if(amount<=0){
      continue;
    }

    total+=
      amount*
      upgrades[i].power;
  }

  const categoryBonus=
    1+
    state.activeCategory*.01;

  const rebirthBonus=
    1+
    state.rebirths*.25;

  const comboBonus=
    1+
    Math.min(
      state.combo,
      100
    )*.005;

  return (
    total*
    state.multiplier*
    categoryBonus*
    rebirthBonus*
    comboBonus
  );
}

/* =========================================================
   CLICK POWER
========================================================= */

function getClickPower(multiplier=1){

  let power=1;

  const start=
    state.activeCategory*30;

  const end=
    start+30;

  /*
    Active category upgrades contribute to clicks.
  */

  for(let i=start;i<end;i++){

    if(state.owned[i]>0){

      power+=
        state.owned[i]*
        upgrades[i].power*
        .15;
    }
  }

  return (
    power*
    multiplier*
    state.multiplier*
    (1+state.rebirths*.25)*
    (1+Math.min(state.combo,100)*.01)
  );
}

/* =========================================================
   XP
========================================================= */

function addXP(amount){

  if(!Number.isFinite(amount)){
    return;
  }

  state.xp+=Math.max(0,amount);

  while(
    state.xp>=state.xpNeeded
  ){

    state.xp-=state.xpNeeded;

    state.level++;

    state.xpNeeded=
      Math.floor(
        state.xpNeeded*1.18
      );

    state.maxEnergy+=5;

    state.energy=
      state.maxEnergy;

    toast(
      "⭐ Frog Level "+state.level+"!"
    );

    addLog(
      "⭐ Reached Frog Level "+
      state.level
    );
  }
}

/* =========================================================
   FROG CLICK
========================================================= */

function clickFrog(multiplier=1){

  if(state.energy<1){

    toast("⚡ Frog needs energy!");
    return;
  }

  state.energy--;

  state.clicks++;

  state.combo++;

  state.bestCombo=
    Math.max(
      state.bestCombo,
      state.combo
    );

  const amount=
    getClickPower(multiplier);

  state.coins+=amount;

  addXP(
    Math.max(
      1,
      Math.floor(multiplier)
    )
  );

  floatingNumber(
    "+"+
    formatNumber(amount)+
    " 🌿"
  );

  updateStats();
  updateButtonStates();
}

/* =========================================================
   FLOATING NUMBER
========================================================= */

function floatingNumber(text){

  const element=
    document.createElement("div");

  element.className="float";
  element.textContent=text;

  element.style.left=
    (40+Math.random()*20)+"%";

  element.style.top=
    (35+Math.random()*20)+"%";

  $("frogArea").appendChild(element);

  setTimeout(
    ()=>element.remove(),
    800
  );
}

/* =========================================================
   CATEGORY BAR
========================================================= */

function renderCategories(){

  const bar=
    $("categoryTabs");

  bar.innerHTML="";

  categories.forEach(
    (category,index)=>{

      const button=
        document.createElement("button");

      button.type="button";

      button.textContent=
        (index+1)+". "+category;

      if(
        index===
        state.activeCategory
      ){
        button.classList.add("active");
      }

      button.addEventListener(
        "click",
        ()=>{
          selectCategory(index);
        }
      );

      bar.appendChild(button);
    }
  );
}

/* =========================================================
   MECHANIC BAR
========================================================= */

function renderMechanics(){

  const bar=
    $("mechanicTabs");

  bar.innerHTML="";

  const start=
    state.activeCategory*20;

  const end=
    start+20;

  for(
    let i=start;
    i<end;
    i++
  ){

    const button=
      document.createElement("button");

    button.type="button";

    button.textContent=
      mechanics[i];

    if(
      i===
      state.activeMechanic
    ){
      button.classList.add("active");
    }

    const mechanicIndex=i;

    button.addEventListener(
      "click",
      ()=>{
        state.activeMechanic=
          mechanicIndex;

        renderMechanics();
        renderUpgrades();
      }
    );

    bar.appendChild(button);
  }
}

/* =========================================================
   SELECT CATEGORY
========================================================= */

function selectCategory(index){

  if(
    index<0 ||
    index>=categories.length
  ){
    return;
  }

  state.activeCategory=index;

  state.activeMechanic=
    index*20;

  renderCategories();
  renderMechanics();
  renderUpgrades();
}

/* =========================================================
   RENDER UPGRADES
========================================================= */

function renderUpgrades(){

  const panel=
    $("upgrades");

  panel.innerHTML="";

  const start=
    state.activeCategory*30;

  const end=
    start+30;

  $("mechanicTitle").textContent=
    mechanics[state.activeMechanic];

  $("mechanicDescription").textContent=
    categories[state.activeCategory]+
    " system • "+
    mechanics[state.activeMechanic]+
    " • 30 upgrades available.";

  $("upgradeCount").textContent=
    "30 Upgrades";

  for(
    let i=start;
    i<end;
    i++
  ){

    const upgrade=
      upgrades[i];

    const owned=
      state.owned[i];

    const cost=
      getUpgradeCost(i);

    const card=
      document.createElement("div");

    card.className="upgrade";

    const name=
      document.createElement("div");

    name.className="upgrade-name";

    name.textContent=
      "Lv."+
      upgrade.level+
      " "+
      upgrade.name;

    const description=
      document.createElement("div");

    description.className=
      "upgrade-description";

    description.textContent=
      "Increases this system by "+
      formatNumber(upgrade.power)+
      " power per level.";

    const meta=
      document.createElement("div");

    meta.className="upgrade-meta";

    meta.textContent=
      "Owned: "+
      owned+
      " • Cost: "+
      formatNumber(cost)+
      " 🌿";

    const button=
      document.createElement("button");

    button.className="buy";
    button.type="button";

    /*
      IMPORTANT BUG FIX:
      This constant captures the correct
      upgrade ID for this particular button.
    */

    const upgradeIndex=i;

    button.dataset.upgrade=
      String(upgradeIndex);

    button.addEventListener(
      "click",
      event=>{

        event.preventDefault();
        event.stopPropagation();

        buyUpgrade(upgradeIndex);
      }
    );

    card.appendChild(name);
    card.appendChild(description);
    card.appendChild(meta);
    card.appendChild(button);

    panel.appendChild(card);
  }

  updateButtonStates();
}

/* =========================================================
   UPGRADE COST
========================================================= */

function getUpgradeCost(index){

  const upgrade=
    upgrades[index];

  if(!upgrade){
    return Infinity;
  }

  const owned=
    state.owned[index];

  const cost=
    upgrade.baseCost*
    Math.pow(
      1.13,
      owned
    );

  return Number.isFinite(cost)
    ? cost
    : Infinity;
}

/* =========================================================
   UPDATE BUTTON STATES
========================================================= */

function updateButtonStates(){

  const buttons=
    $("upgrades")
      .querySelectorAll(
        "button[data-upgrade]"
      );

  buttons.forEach(
    button=>{

      const index=
        Number(
          button.dataset.upgrade
        );

      if(
        !Number.isInteger(index) ||
        !upgrades[index]
      ){
        button.disabled=true;
        return;
      }

      const cost=
        getUpgradeCost(index);

      const owned=
        state.owned[index];

      button.disabled=
        !Number.isFinite(cost) ||
        state.coins<cost;

      button.textContent=
        "Buy • "+
        formatNumber(cost)+
        " 🌿 • Lv "+
        owned;
    }
  );
}

/* =========================================================
   BUY UPGRADE
========================================================= */

function buyUpgrade(index){

  /*
    Defensive validation.
  */

  if(
    !Number.isInteger(index) ||
    index<0 ||
    index>=upgrades.length
  ){

    console.error(
      "Invalid upgrade:",
      index
    );

    return;
  }

  const upgrade=
    upgrades[index];

  const cost=
    getUpgradeCost(index);

  if(
    !Number.isFinite(cost)
  ){
    toast("❌ Invalid upgrade cost.");
    return;
  }

  if(
    state.coins<cost
  ){

    toast(
      "🌿 Need "+
      formatNumber(
        cost-state.coins
      )+
      " more Lily."
    );

    return;
  }

  state.coins-=cost;

  state.owned[index]++;

  addXP(
    Math.max(
      1,
      Math.floor(
        upgrade.power*2
      )
    )
  );

  addLog(
    "🛒 Bought "+
    upgrade.name
  );

  /*
    Rebuild ONLY after an actual purchase.
    Never rebuild from the animation loop.
  */

  renderUpgrades();
  updateStats();
}

/* =========================================================
   CRITICAL CROAK
========================================================= */

function criticalCroak(){

  if(state.energy<5){

    toast("⚡ Need 5 energy!");
    return;
  }

  state.energy-=5;

  state.criticals++;

  state.combo+=5;

  const amount=
    getClickPower(100)*10;

  state.coins+=amount;

  addXP(50);

  floatingNumber(
    "💥 +"+
    formatNumber(amount)
  );

  toast("💥 CRITICAL CROAK!");

  updateStats();
  updateButtonStates();
}

/* =========================================================
   MEGA CROAK
========================================================= */

function megaCroak(){

  if(state.energy<10){

    toast("⚡ Need 10 energy!");
    return;
  }

  state.energy-=10;

  state.combo+=10;

  const amount=
    getClickPower(25);

  state.coins+=amount;

  addXP(25);

  floatingNumber(
    "🐸 +"+
    formatNumber(amount)
  );

  toast("🐸 MEGA CROAK!");

  updateStats();
  updateButtonStates();
}

/* =========================================================
   BOSS
========================================================= */

function attackBoss(){

  if(state.energy<3){

    toast("⚡ Need 3 energy!");
    return;
  }

  state.energy-=3;

  const damage=
    Math.max(
      1,
      getClickPower(5)
    );

  state.bossHP-=damage;

  addXP(
    Math.max(
      1,
      Math.floor(damage/10)
    )
  );

  floatingNumber(
    "⚔️ -"+
    formatNumber(damage)
  );

  if(state.bossHP<=0){

    state.bossHP=0;

    state.bossesDefeated++;

    const reward=
      Math.max(
        1000,
        state.bossMaxHP*2
      );

    state.coins+=reward;

    addXP(100);

    toast(
      "👹 BOSS DEFEATED! +"+
      formatNumber(reward)+
      " 🌿"
    );

    addLog(
      "🏆 Defeated Pond Boss #"+
      state.bossesDefeated
    );

    setTimeout(
      spawnBoss,
      500
    );
  }

  updateStats();
  updateBoss();
  updateButtonStates();
}

/* =========================================================
   SPAWN BOSS
========================================================= */

function spawnBoss(){

  state.bossMaxHP=
    Math.floor(
      1000*
      Math.pow(
        1.55,
        state.bossesDefeated
      )
    );

  state.bossHP=
    state.bossMaxHP;

  updateBoss();
}

/* =========================================================
   BOSS DISPLAY
========================================================= */

function updateBoss(){

  const percent=
    Math.max(
      0,
      Math.min(
        100,
        state.bossHP/
        state.bossMaxHP*
        100
      )
    );

  $("bossFill").style.width=
    percent+"%";

  $("bossText").textContent=
    formatNumber(state.bossHP)+
    " / "+
    formatNumber(state.bossMaxHP);
}

/* =========================================================
   REBIRTH
========================================================= */

function rebirth(){

  const requirement=
    1000000*
    Math.pow(
      3,
      state.rebirths
    );

  if(
    state.coins<requirement
  ){

    toast(
      "♻️ Need "+
      formatNumber(requirement)+
      " Lily to rebirth."
    );

    return;
  }

  state.rebirths++;

  state.coins=0;

  state.owned.fill(0);

  state.combo=0;

  state.multiplier=
    1+
    state.rebirths*.25;

  state.energy=
    state.maxEnergy;

  addLog(
    "♻️ Pond Rebirth #"+
    state.rebirths
  );

  toast(
    "♻️ REBIRTH "+
    state.rebirths+
    "!"
  );

  renderUpgrades();
  updateStats();
}

/* =========================================================
   STATS
========================================================= */

function updateStats(){

  $("coins").textContent=
    formatNumber(state.coins);

  $("income").textContent=
    formatNumber(
      getIncomePerSecond()
    );

  $("clicks").textContent=
    formatNumber(state.clicks);

  $("level").textContent=
    state.level;

  $("energy").textContent=
    Math.floor(state.energy)+
    "/"+
    state.maxEnergy;

  $("combo").textContent=
    state.combo;

  $("rebirths").textContent=
    state.rebirths;

  const energyPercent=
    Math.max(
      0,
      Math.min(
        100,
        state.energy/
        state.maxEnergy*
        100
      )
    );

  $("energyFill").style.width=
    energyPercent+"%";

  $("energyText").textContent=
    Math.floor(
      energyPercent
    )+"%";

  const xpPercent=
    Math.max(
      0,
      Math.min(
        100,
        state.xp/
        state.xpNeeded*
        100
      )
    );

  $("xpFill").style.width=
    xpPercent+"%";

  $("xpText").textContent=
    formatNumber(state.xp)+
    " / "+
    formatNumber(state.xpNeeded);
}

/* =========================================================
   SAVE
========================================================= */

function saveGame(showToast=true){

  const data={
    version:2,
    coins:state.coins,
    clicks:state.clicks,
    energy:state.energy,
    maxEnergy:state.maxEnergy,
    level:state.level,
    xp:state.xp,
    xpNeeded:state.xpNeeded,
    multiplier:state.multiplier,
    combo:state.combo,
    bestCombo:state.bestCombo,
    rebirths:state.rebirths,
    criticals:state.criticals,
    activeCategory:state.activeCategory,
    activeMechanic:state.activeMechanic,
    owned:state.owned,
    bossHP:state.bossHP,
    bossMaxHP:state.bossMaxHP,
    bossesDefeated:state.bossesDefeated,
    totalPlayTime:state.totalPlayTime,
    savedAt:Date.now()
  };

  try{

    localStorage.setItem(
      "ultimate-frog-clicker",
      JSON.stringify(data)
    );

    if(showToast){
      toast("💾 Game saved!");
    }

  }catch(error){

    console.error(
      "Save error:",
      error
    );

    toast(
      "❌ Could not save game."
    );
  }
}

/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  try{

    const raw=
      localStorage.getItem(
        "ultimate-frog-clicker"
      );

    if(!raw){
      return;
    }

    const data=
      JSON.parse(raw);

    if(
      !data ||
      !Array.isArray(data.owned)
    ){
      return;
    }

    state.coins=
      Math.max(
        0,
        Number(data.coins)||0
      );

    state.clicks=
      Math.max(
        0,
        Number(data.clicks)||0
      );

    state.maxEnergy=
      Math.max(
        100,
        Number(data.maxEnergy)||100
      );

    state.energy=
      Math.max(
        0,
        Math.min(
          state.maxEnergy,
          Number(data.energy)||
          state.maxEnergy
        )
      );

    state.level=
      Math.max(
        1,
        Math.floor(
          Number(data.level)||1
        )
      );

    state.xp=
      Math.max(
        0,
        Number(data.xp)||0
      );

    state.xpNeeded=
      Math.max(
        100,
        Number(data.xpNeeded)||100
      );

    state.multiplier=
      Math.max(
        1,
        Number(data.multiplier)||1
      );

    state.combo=
      Math.max(
        0,
        Number(data.combo)||0
      );

    state.bestCombo=
      Math.max(
        0,
        Number(data.bestCombo)||0
      );

    state.rebirths=
      Math.max(
        0,
        Math.floor(
          Number(data.rebirths)||0
        )
      );

    state.criticals=
      Math.max(
        0,
        Number(data.criticals)||0
      );

    state.activeCategory=
      Math.max(
        0,
        Math.min(
          categories.length-1,
          Math.floor(
            Number(data.activeCategory)||0
          )
        )
      );

    state.activeMechanic=
      Math.max(
        state.activeCategory*20,
        Math.min(
          state.activeCategory*20+19,
          Math.floor(
            Number(data.activeMechanic)||
            state.activeCategory*20
          )
        )
      );

    state.bossMaxHP=
      Math.max(
        1000,
        Number(data.bossMaxHP)||1000
      );

    state.bossHP=
      Math.max(
        0,
        Math.min(
          state.bossMaxHP,
          Number(data.bossHP)||
          state.bossMaxHP
        )
      );

    state.bossesDefeated=
      Math.max(
        0,
        Math.floor(
          Number(data.bossesDefeated)||0
        )
      );

    state.totalPlayTime=
      Math.max(
        0,
        Number(data.totalPlayTime)||0
      );

    /*
      Always rebuild the owned array at the
      exact current upgrade count.
    */

    state.owned=
      Array(upgrades.length).fill(0);

    for(
      let i=0;
      i<Math.min(
        upgrades.length,
        data.owned.length
      );
      i++
    ){

      state.owned[i]=
        Math.max(
          0,
          Math.floor(
            Number(data.owned[i])||0
          )
        );
    }

    /*
      Offline earnings.
      Maximum 12 hours.
    */

    if(
      Number.isFinite(
        Number(data.savedAt)
      )
    ){

      const seconds=
        Math.min(
          43200,
          Math.max(
            0,
            (Date.now()-
             Number(data.savedAt))/1000
          )
        );

      const offlineIncome=
        getIncomePerSecond()*
        seconds*
        .5;

      if(
        Number.isFinite(offlineIncome) &&
        offlineIncome>0
      ){

        state.coins+=
          offlineIncome;

        addLog(
          "🌙 Offline earnings: +"+
          formatNumber(
            offlineIncome
          )+
          " 🌿"
        );
      }
    }

  }catch(error){

    console.error(
      "Load error:",
      error
    );

    /*
      Do not leave a corrupted save
      permanently breaking the game.
    */

    try{
      localStorage.removeItem(
        "ultimate-frog-clicker"
      );
    }catch(_){}
  }
}

/* =========================================================
   RESET
========================================================= */

function resetGame(){

  const confirmed=
    window.confirm(
      "Delete ALL Frog Clicker progress?"
    );

  if(!confirmed){
    return;
  }

  try{

    localStorage.removeItem(
      "ultimate-frog-clicker"
    );

  }catch(_){}

  location.reload();
}

/* =========================================================
   EVENT LISTENERS
========================================================= */

$("frog").addEventListener(
  "click",
  ()=>{
    clickFrog(1);
  }
);

$("frog").addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" ||
      event.key===" "
    ){

      event.preventDefault();

      clickFrog(1);
    }
  }
);

$("megaButton").addEventListener(
  "click",
  megaCroak
);

$("criticalButton").addEventListener(
  "click",
  criticalCroak
);

$("rebirthButton").addEventListener(
  "click",
  rebirth
);

$("bossButton").addEventListener(
  "click",
  attackBoss
);

$("saveButton").addEventListener(
  "click",
  ()=>{
    saveGame(true);
  }
);

$("resetButton").addEventListener(
  "click",
  resetGame
);

/* =========================================================
   COMBO DECAY
========================================================= */

setInterval(
  ()=>{
    if(state.combo>0){
      state.combo=
        Math.max(
          0,
          state.combo-1
        );
    }
  },
  1000
);

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
  performance.now();

function gameLoop(now){

  /*
    Clamp delta so the game cannot generate
    enormous amounts after the browser sleeps.
  */

  const delta=
    Math.min(
      .25,
      Math.max(
        0,
        (now-lastTime)/1000
      )
    );

  lastTime=now;

  state.totalPlayTime+=delta;

  /* Passive income */

  const income=
    getIncomePerSecond();

  if(
    Number.isFinite(income) &&
    income>0
  ){

    state.coins+=
      income*delta;
  }

  /* Energy regeneration */

  state.energy=
    Math.min(
      state.maxEnergy,
      state.energy+
      delta*4
    );

  /*
    IMPORTANT:
    The game loop ONLY updates values.
    It NEVER destroys/recreates upgrade buttons.
  */

  updateStats();

  updateButtonStates();

  requestAnimationFrame(
    gameLoop
  );
}

requestAnimationFrame(
  gameLoop
);

/* =========================================================
   AUTOSAVE
========================================================= */

setInterval(
  ()=>{
    saveGame(false);
  },
  10000
);

/* =========================================================
   STARTUP
========================================================= */

loadGame();

renderCategories();

renderMechanics();

renderUpgrades();

updateStats();

updateBoss();

addLog(
  "🐸 Welcome to Ultimate Frog Clicker!"
);

addLog(
  "🌿 "+
  categories.length+
  " categories loaded."
);

addLog(
  "⚙️ "+
  mechanics.length+
  " mechanics loaded."
);

addLog(
  "🛒 "+
  upgrades.length+
  " upgrades loaded."
);

  });

    );

    );

})();
